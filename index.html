<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cadastro de Romaneio · Motoristas, Transportadoras e Veículos</title>
<style>
:root{
  --bg:#0f1319; --surface:#171d26; --surface2:#1e2630; --border:#2b3542;
  --text:#e8edf3; --dim:#97a3b4; --faint:#667386;
  --accent:#f5b53d; --accent-ink:#1a1200; --ok:#3fb97a; --err:#ef5b5b; --info:#4aa3ff;
  --mono:'Lucida Console','Consolas','Courier New',monospace;
  --sans:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px}
#app{display:flex;flex-direction:column;height:100dvh}
header{display:flex;align-items:center;gap:14px;padding:10px 18px;background:var(--surface);border-bottom:1px solid var(--border);flex-wrap:wrap}
.brand{font-weight:700;letter-spacing:.3px}.brand small{display:block;font-weight:400;color:var(--faint);font-size:11px}
nav{display:flex;gap:4px;flex:1;flex-wrap:wrap}
nav button{border:0;background:transparent;color:var(--dim);padding:8px 14px;border-radius:6px;font-weight:600}
nav button.on{background:var(--surface2);color:var(--accent)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:5px 10px;border-radius:99px;background:var(--surface2);border:1px solid var(--border);color:var(--dim);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.chip.ok .dot{background:var(--ok)}.chip.warn .dot{background:var(--accent)}.chip.err .dot{background:var(--err)}
main{flex:1;overflow:auto;padding:18px}
footer{flex:0 0 auto;text-align:center;padding:8px;font-size:11.5px;color:var(--faint);border-top:1px solid var(--border)}
h2{margin:0 0 4px;font-size:18px}.sub{color:var(--dim);margin:0 0 16px}
.grid{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}.grid>*{min-width:0}.g2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
@media(max-width:1000px){.g2{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px}
.card h3{margin:0 0 12px;font-size:12px;letter-spacing:.8px;text-transform:uppercase;color:var(--faint)}
label.f{display:block;font-size:11.5px;color:var(--dim);margin:0 0 4px;font-weight:600}
.in,select.in,textarea.in{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:9px 11px;border-radius:7px;outline:0}
.in:focus{border-color:var(--accent)}
.in[readonly]{opacity:.6}
.row{display:grid;gap:10px;margin-bottom:10px}.r2{grid-template-columns:1fr 1fr}.r3{grid-template-columns:1fr 1fr 1fr}.r4{grid-template-columns:2fr 1fr 1fr}
@media(max-width:600px){.r2,.r3,.r4{grid-template-columns:1fr}}
.btn{border:1px solid var(--border);background:var(--surface2);color:var(--text);padding:9px 14px;border-radius:7px;font-weight:600}
.btn:hover{border-color:var(--faint)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.big{padding:13px 20px;font-size:15px}
.btn.danger{color:var(--err)}
.btn.sm{padding:5px 9px;font-size:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chipbtn{border:1px solid var(--border);background:var(--surface2);color:var(--text);padding:7px 12px;border-radius:99px;font-weight:700;font-size:12.5px}
.chipbtn:hover,.chipbtn.on{border-color:var(--accent);color:var(--accent)}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--faint);padding:8px 10px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface)}
td{padding:8px 10px;border-bottom:1px solid var(--border)}
tbody tr{cursor:pointer}tbody tr:hover{background:var(--surface2)}
.tw{max-height:calc(100dvh - 300px);overflow:auto;border:1px solid var(--border);border-radius:8px}
.mono{font-family:var(--mono)}
.sugg{position:relative}
.sugg-list{position:absolute;left:0;right:0;top:100%;z-index:20;background:var(--surface2);border:1px solid var(--accent);border-radius:7px;max-height:300px;overflow:auto;margin-top:4px}
.sugg-list div{padding:8px 11px;cursor:pointer;border-bottom:1px solid var(--border)}
.sugg-list div:hover,.sugg-list div.hl{background:var(--surface)}
.sugg-list small{color:var(--dim);display:block}
/* terminal */
.term{background:#02040a;border:1px solid #1d3b78;border-radius:6px;padding:14px;overflow:auto}
.term pre{margin:0;font-family:var(--mono);font-size:14px;line-height:1.45;color:#f2f2f2;white-space:pre}
.term .box{outline:2px solid #e02f2f;outline-offset:6px;display:inline-block;padding:2px 0}
.term .hl{background:#ffff80;color:#000}
.paste{background:#02040a;border:1px solid var(--border);border-radius:6px;overflow:auto;max-height:420px}
.paste .ln{display:flex;font-family:var(--mono);font-size:13px;line-height:1.55;border-bottom:1px solid #0e1522}
.paste .n{flex:0 0 36px;text-align:right;padding-right:8px;color:var(--faint);user-select:none;background:#080c14}
.paste .t{white-space:pre;color:#f2f2f2;padding-left:8px;flex:1}
.paste .t i{color:#35507d;font-style:normal}
.paste .l{flex:0 0 52px;text-align:right;padding-right:8px;color:var(--faint);font-size:11px;user-select:none;background:#080c14}
.ruler{font-family:var(--mono);font-size:11px;color:var(--faint);white-space:pre;padding-left:44px;margin-top:4px}
.drawer-bg{position:fixed;inset:0;background:#0009;z-index:50;display:flex;justify-content:flex-end}
.drawer{width:min(520px,100%);background:var(--surface);border-left:1px solid var(--border);padding:20px;overflow:auto;height:100%}
.drawer h2{display:flex;justify-content:space-between;align-items:center}
.saved{font-size:12px;color:var(--faint)}.saved.ok{color:var(--ok)}.saved.sv{color:var(--accent)}
.toast{position:fixed;left:50%;bottom:50px;transform:translateX(-50%);background:var(--surface2);border:1px solid var(--accent);padding:10px 18px;border-radius:8px;z-index:99;box-shadow:0 8px 24px #0008}
.empty{padding:40px;text-align:center;color:var(--faint)}
.warn{color:var(--accent);font-size:12px}.bad{color:var(--err);font-size:12px}
.tools{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.tools .in{flex:1;min-width:200px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;font-size:13px}.kv b{color:var(--dim);font-weight:600}
code{background:var(--surface2);padding:1px 6px;border-radius:4px;font-family:var(--mono);font-size:12px}

/* tabela estilo planilha (cabeçalho na paleta da ferramenta) */
.sheetw{max-height:calc(100dvh - 330px);border:0;border-radius:0;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
table.sheet{table-layout:fixed}
.sheet th{background:var(--accent);color:var(--accent-ink);text-align:center;font-size:12.5px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;padding:9px 6px;border:1px solid #00000040;z-index:3}
.sheet td{padding:0;border:1px solid var(--border);vertical-align:middle}
.sheet tbody tr{cursor:default}
.sheet td input,.sheet td select{width:100%;background:transparent;border:0;outline:0;color:var(--text);padding:9px 10px;font-size:13.5px;text-overflow:ellipsis}
.sheet td.c input,.sheet td.c select{text-align:center}
.sheet td input:focus,.sheet td select:focus{background:var(--surface2);box-shadow:inset 0 0 0 2px var(--accent)}
.sheet td input.ro{opacity:.85}
.sheet td select option{background:var(--surface2)}
.sheet td.tn{padding:9px 10px;font-size:13px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet tr.newrow td{background:var(--surface2);border-bottom:2px solid var(--accent)}
.sheet tr.flash td{background:#f5b53d33;transition:background 1s}
.addbar{display:flex;gap:8px;margin-bottom:10px}.addbar .in{flex:1}.addbar .btn{white-space:nowrap}
/* ===== banner animado ===== */
.banner{flex:0 0 auto;background:#020f2b;border-bottom:1px solid var(--border);line-height:0;overflow:hidden}
.banner svg{display:block;width:100%;height:clamp(64px,10.5vw,200px)}
.bn-bar{transform-box:fill-box;transform-origin:50% 100%;animation:bnBar 2.6s ease-in-out infinite}
.bn-bar:nth-child(1){animation-duration:2.1s}
.bn-bar:nth-child(2){animation-duration:2.9s;animation-delay:-.7s}
.bn-bar:nth-child(3){animation-duration:2.4s;animation-delay:-1.3s}
.bn-bar:nth-child(4){animation-duration:3.1s;animation-delay:-.2s}
.bn-bar:nth-child(5){animation-duration:2.2s;animation-delay:-1.8s}
@keyframes bnBar{0%,100%{transform:scaleY(.3)}45%{transform:scaleY(1)}70%{transform:scaleY(.62)}}
.bn-scan{animation:bnScan 3.6s linear infinite}
@keyframes bnScan{0%{transform:translateY(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(31px);opacity:0}}
.bn-sweep{animation:bnSweep 3.2s ease-in-out infinite}
@keyframes bnSweep{0%{transform:translateX(0);opacity:0}15%{opacity:.9}85%{opacity:.9}100%{transform:translateX(88px);opacity:0}}
.bn-pulse{animation:bnPulse 2.2s ease-in-out infinite}
@keyframes bnPulse{0%,100%{opacity:.05}50%{opacity:.5}}
.bn-lamp{transform-box:fill-box;transform-origin:center;animation:bnLamp 1.8s ease-in-out infinite}
@keyframes bnLamp{0%,100%{transform:scale(.8);opacity:.75}50%{transform:scale(1.35);opacity:1}}
.bn-flare{transform-box:fill-box;transform-origin:center;animation:bnFlare 1.8s ease-in-out infinite}
@keyframes bnFlare{0%,100%{transform:scale(.7);opacity:.35}50%{transform:scale(1.3);opacity:.95}}
.bn-floor{transform-box:fill-box;transform-origin:center;animation:bnFloor 1.8s ease-in-out infinite}
@keyframes bnFloor{0%,100%{transform:scale(.85);opacity:.25}50%{transform:scale(1.15);opacity:.7}}
@media (prefers-reduced-motion:reduce){.banner *{animation:none!important}}


/* linhas neon do banner */
.nx-dot{animation:nxDot 1.8s ease-in-out infinite}
@keyframes nxDot{0%,100%{opacity:.7}50%{opacity:1}}
.nx-flow{animation:nxFlow 2.4s linear infinite}
.nx-flow2{animation-duration:3s;animation-delay:-1s}
@keyframes nxFlow{from{stroke-dashoffset:164}to{stroke-dashoffset:0}}
.nx-sweep{animation:nxSweep 5.5s ease-in-out infinite alternate}
@keyframes nxSweep{from{transform:translateX(0)}to{transform:translateX(1694px)}}
@media (prefers-reduced-motion:reduce){.nx-dot,.nx-flow,.nx-sweep{animation:none!important}}

/* ===== login ===== */
[hidden]{display:none!important}
.locked header{display:none}
main.gmode{display:flex;padding:24px 16px}
.gcard{margin:auto;width:min(400px,100%);background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:28px 26px;box-shadow:0 20px 60px #0008}
.ghead{display:flex;align-items:center;gap:13px;margin-bottom:22px}
.glock{flex:0 0 auto;width:44px;height:44px;border-radius:12px;background:var(--surface2);border:1px solid var(--border);display:grid;place-items:center;font-size:20px}
.gcard h2{margin:0;font-size:19px}
.gsub{margin:3px 0 0;color:var(--dim);font-size:12.5px}
.gcard .fld{margin-bottom:14px}
.gcard .fld .in{padding:12px;font-size:15px}
.pw{position:relative}.pw .in{padding-right:46px}
.pw button{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--dim);padding:6px 10px;font-size:16px}
.gcaps{margin-top:6px;font-size:12px;color:var(--accent)}
.gcheck{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--dim);margin:2px 0 6px;cursor:pointer}
.gerr{min-height:20px;color:var(--err);font-size:12.5px;margin:4px 0 10px;line-height:1.4}
.btn.full{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.gcard details{margin-top:18px;color:var(--dim);font-size:12.5px;line-height:1.55;border-top:1px solid var(--border);padding-top:14px}
.gcard summary{cursor:pointer;color:var(--accent);font-weight:600}
.gwarn{background:#f5b53d1a;border:1px solid #f5b53d55;color:var(--accent);border-radius:8px;padding:9px 11px;font-size:12.5px;margin-bottom:14px;line-height:1.45}
/* a tabela precisa descontar a altura do banner */
.tw{max-height:calc(100dvh - 300px - clamp(64px,10.5vw,200px))}
.sheetw{max-height:calc(100dvh - 330px - clamp(64px,10.5vw,200px))}
</style>
</head>

const FIREBASE_CONFIG = {

const LOGIN_DOMAIN = "romaneio.app";

const parseFbCfg = t => {
  t = String(t || '').trim();
  try { return JSON.parse(t); } catch {}
  const o = {};
  for (const m of t.matchAll(/["']?(\w+)["']?\s*:\s*["']([^"']*)["']/g)) o[m[1]] = m[2];
  return o;
};

/* ---------- utilitários ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const digits = s => String(s ?? '').replace(/\D/g, '');
const fmtCpf = c => { const d = digits(c); return d.length === 11 ? `${d.slice(0,3)}.${d.slice(3,6)}.${d.slice(6,9)}-${d.slice(9)}` : (c || ''); };
const norm = s => String(s ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase();
const cpfOk = c => { const d = digits(c); if (d.length !== 11 || /^(\d)\1+$/.test(d)) return false;
  for (const n of [9, 10]) { let s = 0; for (let i = 0; i < n; i++) s += +d[i] * (n + 1 - i); const v = (s * 10) % 11 % 10; if (v !== +d[n]) return false; } return true; };
const debounce = (fn, ms) => { let t; const f = (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; f.flush = (...a) => { clearTimeout(t); fn(...a); }; return f; };

const LS = { get: (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } }, set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };

/* =====================================================================
   CAMADA DE DADOS  (Firestore em tempo real  |  modo local)

   - gravação por CAMPO (merge) → mesma ficha, campos diferentes = sem conflito
   ===================================================================== */
const COLS = ['motoristas', 'transportadoras', 'pessoal', 'historico', 'config'];
const Store = {
  mode: 'local', online: true, pending: 0, user: LS.get('rom_user', ''),
  data: Object.fromEntries(COLS.map(c => [c, new Map()])),
  subs: new Set(), unsubs: [], fb: null, ready: false, error: '',

  emit(col) { this.subs.forEach(f => f(col)); },

  async init() {
    /* a configuração vem sozinha do Firebase Hosting (/__/firebase/init.json); FIREBASE_CONFIG é só reserva */

    if (!(cfg && cfg.apiKey && cfg.projectId)) cfg = LS.get('rom_fbcfg', null);

      catch (e) { console.error(e); this.error = 'Não foi possível conectar ao Firebase (' + (e.code || e.message) + ').'; }

    this.initLocal();

  async initFirebase(cfg) {
    const [A, F, AU] = await Promise.all([import(FB_SDK + 'firebase-app.js'), import(FB_SDK + 'firebase-firestore.js'), import(FB_SDK + 'firebase-auth.js')]);

    this.online = navigator.onLine;
  },

  startSync() {
    if (this.unsubs.length || !this.fb) return;
    const { F, db } = this.fb;
    for (const col of COLS) {
      let q = F.collection(db, col);

    this.unsubs.forEach(u => { try { u(); } catch {} }); this.unsubs = [];

    this.mode = 'local';

    load();

  },
  persistLocal(col) { LS.set('rom_local_' + col, [...this.data[col].values()]); },

  /* grava SOMENTE os campos alterados (merge) */
  async set(col, id, patch) {
    const meta = { updatedBy: this.user || 'anon' };
    const prev = this.data[col].get(id) || { id };
    this.data[col].set(id, { ...prev, ...patch, ...meta, id, updatedAtLocal: Date.now() });

    if (this.mode === 'local') { this.persistLocal(col); return; }
    const { F, db } = this.fb; this.pending++; this.emit('conn');
    try { await F.setDoc(F.doc(db, col, id), { ...patch, ...meta, updatedAt: F.serverTimestamp() }, { merge: true }); }
    catch (e) { this.error = 'Erro ao salvar: ' + (e.code || e.message); toast(this.error); }
    finally { this.pending--; this.emit('conn'); }
  },
  async add(col, obj) {
    const id = 'h' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    if (this.mode === 'local') { this.data[col].set(id, { ...obj, id, ts: Date.now() }); this.persistLocal(col); this.emit(col); return id; }
    const { F, db } = this.fb; this.pending++; this.emit('conn');
    try { await F.setDoc(F.doc(db, col, id), { ...obj, ts: F.serverTimestamp() }); } finally { this.pending--; this.emit('conn'); }
    return id;
  },
  async del(col, id) {
    this.data[col].delete(id); this.emit(col);
    if (this.mode === 'local') { this.persistLocal(col); return; }
    const { F, db } = this.fb; this.pending++; this.emit('conn');
    try { await F.deleteDoc(F.doc(db, col, id)); } finally { this.pending--; this.emit('conn'); }
  },
  async bulk(col, items, idFn) {   // importação em lote (500 por commit)
    if (this.mode === 'local') { items.forEach(o => this.data[col].set(idFn(o), { ...o, id: idFn(o) })); this.persistLocal(col); this.emit(col); return; }
    const { F, db } = this.fb; this.pending++; this.emit('conn');
    try {
      for (let i = 0; i < items.length; i += 400) {
        const b = F.writeBatch(db);
        items.slice(i, i + 400).forEach(o => b.set(F.doc(db, col, idFn(o)), { ...o, updatedBy: this.user || 'import', updatedAt: F.serverTimestamp() }, { merge: true }));
        await b.commit();
      }
    } finally { this.pending--; this.emit('conn'); }
  }
};

const idOf = code => String(code || '').replace(/\u00a0/g, ' ').trim().toUpperCase().replace(/[\/\s]+/g, '');
const transpName = code => { const t = Store.get('transportadoras', idOf(code)); return t ? t.nome : ''; };
const layout = () => { const c = Store.get('config', 'layout'); return { ...DEFAULT_LAYOUT, ...(c ? { placaLen: c.placaLen ?? DEFAULT_LAYOUT.placaLen, confirma: c.confirma ?? DEFAULT_LAYOUT.confirma, linhasCurto: c.linhasCurto ?? DEFAULT_LAYOUT.linhasCurto, linhas: c.linhasTxt ? String(c.linhasTxt).split('\n') : DEFAULT_LAYOUT.linhas } : {}) }; };

/* =====================================================================
   GERAÇÃO DO TEXTO DE COLAGEM  (idêntico ao bloco A4:A19 da planilha)
   ===================================================================== */
function buildPaste(R, drv) {
  const L = layout();
  const placa = (R.placa || '').toUpperCase();
  const map = {
    cpf: drv ? digits(drv.cpf) : '', nome: drv ? drv.nome : '', rg: drv ? drv.rg : '', transp: drv ? drv.transp : '',
    transp_nome: drv ? transpName(drv.transp) : '', confirma: L.confirma,
    placa: placa ? placa.padStart(Math.max(L.placaLen, placa.length), ' ') : '',
    conf1: R.conf[0], conf2: R.conf[1], conf3: R.conf[2], ajud1: R.ajud[0], ajud2: R.ajud[1], ajud3: R.ajud[2]
  };
  let lines = L.linhas.map(t => t.replace(/\{(\w+)\}/g, (_, k) => map[k] ?? ''));
  if (drv && drv.perfil === 'curto') lines = lines.slice(0, L.linhasCurto);
  return lines;
}
const pasteText = lines => lines.join('\r\n') + '\r\n';

/* ---------- espelho da tela do sistema ---------- */
function screenText(R, drv) {
  const p = (s, n) => String(s ?? '').slice(0, n).padEnd(n);

  const tr = drv ? (drv.transp ? `${drv.transp} ${transpName(drv.transp)}`.trim() : '') : '';
  const c = i => p(R.conf[i], 11), a = i => p(R.ajud[i], 11);

    `Placa: ${R.placa || ''}`,
    `Conferente 1: ${c(0)}Conferente 2: ${c(1)}Conferente 3: ${c(2)}`.replace(/\s+$/, ''),
    `Ajudante ..1: ${a(0)}Ajudante ..2: ${a(1)}Ajudante ..3: ${a(2)}`.replace(/\s+$/, '')
  ];
}

function searchDrivers(q) {
  const n = norm(q).trim(), d = digits(q); if (!n && !d) return [];
  const out = [];
  for (const m of Store.data.motoristas.values()) {
    if ((d && d.length >= 3 && m.cpf.includes(d)) || (n && (norm(m.nome).includes(n) || norm(m.placa).includes(n) || norm(m.atalho).includes(n)))) { out.push(m); if (out.length >= 25) break; }
  }
  return out;
}

    if (flashId) { const f = $('#bM .flash'); if (f) f.scrollIntoView({ block: 'center' }); const id = flashId; flashId = ''; setTimeout(() => $(`#bM tr[data-id="${id}"]`)?.classList.remove('flash'), 2500); }
  };
  const drawT = () => { $('#bT').innerHTML = Store.list('transportadoras').sort(byName).map(r => `<tr data-id="${esc(r.id)}"><td class="c"><input class="mono ro" value="${esc(r.id)}" readonly tabindex="-1"></td><td><input data-k="nome" value="${esc(r.nome)}"></td><td class="c"><button class="btn sm danger" data-del>✕</button></td></tr>`).join('') || '<tr><td colspan="3" class="empty">Nenhuma transportadora.</td></tr>'; };
  const drawE = () => { $('#bE').innerHTML = Store.list('pessoal').sort(byName).map(r => `<tr data-id="${esc(r.id)}"><td><input data-k="nome" value="${esc(r.nome)}"></td><td class="c"><select data-k="tipo"><option value="conferente" ${r.tipo === 'conferente' ? 'selected' : ''}>Conferente</option><option value="ajudante" ${r.tipo === 'ajudante' ? 'selected' : ''}>Ajudante</option></select></td><td class="c"><select data-k="ativo"><option value="1" ${r.ativo !== false ? 'selected' : ''}>Sim</option><option value="0" ${r.ativo === false ? 'selected' : ''}>Não</option></select></td><td class="c"><button class="btn sm danger" data-del>✕</button></td></tr>`).join('') || '<tr><td colspan="4" class="empty">Equipe vazia.</td></tr>'; };
  CAD = { drawM, drawT, drawE, drawDL };
  drawDL(); drawM(); drawT(); drawE();

  /* ----- filtros ----- */
  $('#mq').oninput = e => { mq = e.target.value; mpage = 0; drawM(); };
  $('#mf').onchange = e => { mf = e.target.value; mpage = 0; drawM(); };

  /* ----- edição inline com autosave (delegação) ----- */
  const wire = (tbody, col, onAfter) => {
    const h = e => { const el = e.target; if (!el.dataset.k) return; const tr = el.closest('tr'), id = tr.dataset.id; let v = el.value;
      if (col === 'pessoal' && el.dataset.k === 'ativo') v = v === '1'; else v = fmtVal(el.dataset.k, v);
      if (col === 'pessoal' && el.dataset.k === 'nome') v = v.toUpperCase();
      if (el.dataset.k === 'transp') tr.querySelector('.tn').innerHTML = tnCell(v);
      autosave(col, id, el.dataset.k, v); };
    tbody.addEventListener('input', h); tbody.addEventListener('change', e => { if (e.target.tagName === 'SELECT') h(e); });
    tbody.addEventListener('click', async e => { const b = e.target.closest('[data-del]'); if (!b) return; const id = b.closest('tr').dataset.id;
      if (confirm('Excluir para TODOS os usuários?')) { await Store.del(col, id); svst('Excluído ✓'); if (col === 'transportadoras') { drawDL(); drawM(); } } });
  };
  wire($('#bM'), 'motoristas'); wire($('#bT'), 'transportadoras'); wire($('#bE'), 'pessoal');

  /* ----- novo motorista (linha de entrada no topo da própria tabela) ----- */
  const ins = [...document.querySelectorAll('#tbM [data-n]')];
  ins.forEach(el => { el.value = NEWD[el.dataset.n] || ''; });
  const tnNew = () => { const c = idOf(NEWD.transp); $('#nTn').innerHTML = c ? tnCell(c) : '—'; };
  tnNew();
  ins.forEach(el => { el.addEventListener('input', () => { const k = el.dataset.n; if (k === 'nome' || k === 'placa') el.value = el.value.toUpperCase(); NEWD[k] = el.value; LS.set('rom_newdrv', NEWD); if (k === 'transp') tnNew(); }); el.addEventListener('keydown', e => { if (e.key === 'Enter') addDriver(); }); });
  async function addDriver() {
    let c = digits(NEWD.cpf); const nome = NEWD.nome.trim().toUpperCase();
    if (c.length < 8 || c.length > 11) return toast('Informe um CPF válido (11 dígitos)');
    c = c.padStart(11, '0'); if (!nome) return toast('Informe o nome do motorista');
    if (Store.get('motoristas', c)) { mq = c; mf = ''; $('#mq').value = c; drawM(); return toast('CPF já cadastrado — mostrando a ficha existente'); }
    const code = idOf(NEWD.transp);
    await Store.set('motoristas', c, { cpf: c, nome, rg: NEWD.rg.trim(), transp: code, placa: NEWD.placa.trim().toUpperCase(), atalho: '', perfil: '' });
    if (code && !Store.get('transportadoras', code)) toast('Salvo. Atenção: o código ' + code + ' ainda não está em Transportadoras.'); else toast('Motorista cadastrado ✓');
    Object.assign(NEWD, { cpf: '', nome: '', rg: '', transp: '', placa: '' }); LS.set('rom_newdrv', NEWD); ins.forEach(el => el.value = ''); tnNew();
    mq = ''; mf = ''; $('#mq').value = ''; drawDL(); flashId = c; ordIds = null; drawM(); ins[0].focus();
  }
  $('#nAdd').onclick = addDriver;

  /* ----- nova transportadora / nova pessoa ----- */
  const addT = async () => { const c = idOf($('#tC').value), n = $('#tN').value.trim(); if (!c || !n) return toast('Informe código e nome');
    await Store.set('transportadoras', c, { codigo: c, nome: n }); $('#tC').value = $('#tN').value = ''; drawDL(); drawT(); drawM(); toast('Transportadora salva ✓'); };
  $('#tAdd').onclick = addT; [$('#tC'), $('#tN')].forEach(el => el.onkeydown = e => { if (e.key === 'Enter') addT(); });
  const addE = async () => { const n = $('#eN').value.trim().toUpperCase(); if (!n) return toast('Informe o nome');
    await Store.set('pessoal', 'p' + Date.now().toString(36), { nome: n, tipo: $('#eT').value, ativo: true }); $('#eN').value = ''; toast('Pessoa adicionada ✓'); };
  $('#eAdd').onclick = addE; $('#eN').onkeydown = e => { if (e.key === 'Enter') addE(); };
}

/* ---------- HISTÓRICO ---------- */
function viewHist(m) {
  const rows = Store.list('historico').sort((a, b) => tms(b.ts) - tms(a.ts)).slice(0, 150);
  m.innerHTML = `<h2>Histórico de romaneios copiados</h2><p class="sub">Últimos 150 registros de todos os usuários.</p><div class="tw"><table><thead><tr><th>Quando</th><th>Usuário</th><th>Motorista</th><th>Transportadora</th><th>Placa</th><th>Equipe</th></tr></thead><tbody>${rows.map(r => `<tr style="cursor:default"><td>${new Date(tms(r.ts)).toLocaleString('pt-BR')}</td><td>${esc(r.usuario)}</td><td>${esc(r.nome)}<br><small class="mono">${fmtCpf(r.cpf)}</small></td><td>${esc(r.transpNome || r.transp)}</td><td class="mono">${esc(r.placa)}</td><td>${esc([...(r.conf || []), ...(r.ajud || [])].join(', '))}</td></tr>`).join('') || '<tr><td colspan="6" class="empty">Sem registros.</td></tr>'}</tbody></table></div>`;
}
const tms = t => t && t.toMillis ? t.toMillis() : (typeof t === 'number' ? t : 0);

/* ---------- CONFIGURAÇÕES ---------- */
function viewConfig(m) {
  const L = layout();
  const cfgDoc = Store.get('config', 'layout');
  m.innerHTML = `<h2>Configurações</h2><p class="sub">Layout do texto de colagem (compartilhado por todos) e importação/exportação.</p>
  <div class="grid g2"><div class="grid">
  <div class="card"><h3>Layout do texto de colagem (compartilhado)</h3>
    <div class="row r2"><div><label class="f">Tamanho total da linha da placa</label><input class="in" id="cLen" type="number" min="8" value="${L.placaLen}"></div>
    <div><label class="f">Linhas do perfil “curto”</label><input class="in" id="cCur" type="number" min="1" value="${L.linhasCurto}"></div></div>
    <div class="row"><div><label class="f">Texto da confirmação</label><input class="in" id="cConf" value="${esc(L.confirma)}"></div></div>
    <div class="row"><div><label class="f">Sequência de linhas (uma por linha)</label><textarea class="in mono" id="cSeq" rows="17">${esc(L.linhas.join('\n'))}</textarea></div></div>
    <p class="sub" style="font-size:12px">Campos: <code>{cpf}</code> <code>{nome}</code> <code>{rg}</code> <code>{transp}</code> <code>{transp_nome}</code> <code>{confirma}</code> <code>{placa}</code> <code>{conf1}</code> <code>{conf2}</code> <code>{conf3}</code> <code>{ajud1}</code> <code>{ajud2}</code> <code>{ajud3}</code>. Qualquer outro texto (como <code>.</code> ou <code>LACR</code>) é enviado literalmente.</p>
    <div style="display:flex;gap:10px;align-items:center"><span class="saved" id="lsv">${cfgDoc ? 'Layout personalizado' : 'Layout padrão (igual à planilha)'}</span><button class="btn sm" id="cReset">Restaurar padrão</button></div></div>
  </div><div class="grid">
  <div class="card"><h3>Dados</h3>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn" id="seedBtn">Importar base da planilha OFICIALIZAÇÃO 2026</button>
      <button class="btn" id="exCsv">Exportar motoristas (CSV)</button>
      <button class="btn" id="imCsv">Importar CSV</button><input type="file" id="imF" accept=".csv,.txt" hidden></div>
    <p class="sub" style="font-size:12px;margin-top:10px">CSV com colunas: CPF;NOME;RG;CODIGO;PLACA;ATALHO (separador ; ou ,). CPFs existentes são atualizados, os demais criados.</p>
    <div class="kv" style="margin-top:8px"><b>Motoristas</b><span>${Store.data.motoristas.size}</span><b>Transportadoras</b><span>${Store.data.transportadoras.size}</span><b>Equipe</b><span>${Store.data.pessoal.size}</span></div></div>
  </div></div>`;
  const saveLayout = debounce(async () => { await Store.set('config', 'layout', { placaLen: +$('#cLen').value || 160, linhasCurto: +$('#cCur').value || 12, confirma: $('#cConf').value, linhasTxt: $('#cSeq').value }); $('#lsv').textContent = 'Layout salvo ✓'; }, 700);
  ['#cLen', '#cCur', '#cConf', '#cSeq'].forEach(s => $(s).oninput = () => { $('#lsv').textContent = 'Salvando…'; saveLayout(); });
  $('#cReset').onclick = async () => { if (confirm('Voltar ao layout padrão para todos?')) { await Store.del('config', 'layout'); render(); } };
  $('#seedBtn').onclick = async () => {
    const sd = JSON.parse(document.getElementById('seedData').textContent);
    if (!confirm(`Importar ${sd.motoristas.length} motoristas, ${sd.transportadoras.length} transportadoras e ${sd.pessoal.length} conferentes?\nRegistros já existentes (mesmo CPF/código) serão ATUALIZADOS.`)) return;
    toast('Importando…');
    await Store.bulk('transportadoras', sd.transportadoras.map(t => ({ ...t, id: idOf(t.codigo) })), o => o.id);
    await Store.bulk('motoristas', sd.motoristas.map(d => ({ ...d, transp: idOf(d.transp) })), o => o.cpf);
    const have = new Set(Store.list('pessoal').map(p => p.nome));
    await Store.bulk('pessoal', sd.pessoal.filter(p => !have.has(p.nome)).map((p, i) => ({ ...p, ativo: true, id: 'p' + Date.now().toString(36) + i })), o => o.id);
    toast('Importação concluída'); render();
  };
  $('#exCsv').onclick = () => { const rows = ['CPF;NOME;RG;CODIGO;PLACA;ATALHO', ...Store.list('motoristas').map(d => [d.cpf, d.nome, d.rg, d.transp, d.placa, d.atalho].map(x => String(x ?? '').replace(/;/g, ',')).join(';'))]; const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['\ufeff' + rows.join('\r\n')], { type: 'text/csv' })); a.download = 'motoristas.csv'; a.click(); };
  $('#imCsv').onclick = () => $('#imF').click();
  $('#imF').onchange = async e => {
    const f = e.target.files[0]; if (!f) return; const t = (await f.text()).replace(/^\ufeff/, ''); const ls = t.split(/\r?\n/).filter(Boolean); const sep = ls[0].includes(';') ? ';' : ',';
    const hd = ls[0].split(sep).map(h => norm(h).trim()); const ix = k => hd.indexOf(k);
    const items = ls.slice(1).map(l => { const c = l.split(sep); const g = k => (c[ix(k)] || '').trim(); const cpf = digits(g('CPF')).padStart(11, '0'); return { cpf, nome: g('NOME').toUpperCase(), rg: g('RG'), transp: idOf(g('CODIGO')), placa: g('PLACA').toUpperCase(), atalho: g('ATALHO') }; }).filter(x => x.cpf.length === 11 && x.nome);
    if (!items.length) return toast('Nenhuma linha válida'); await Store.bulk('motoristas', items, o => o.cpf); toast(items.length + ' motoristas importados'); render();
  };
}

/* ---------- operador ---------- */
function askUser(force) {
  if (Store.user && !force) return;
  const n = (prompt('Seu nome (aparece no histórico e nos registros):', Store.user || '') || '').trim().toUpperCase();
  if (n) { Store.user = n; LS.set('rom_user', n); R = LS.get('rom_draft_' + n, R); }
  renderConn();
}

/* ---------- boot ---------- */
Store.on(col => {
  renderConn();
  if (col === 'conn') return;
  if (tab === 'cadastro' && CAD) {
    if (col === 'motoristas') keepFocus(CAD.drawM);
    else if (col === 'transportadoras') keepFocus(() => { CAD.drawDL(); CAD.drawT(); CAD.drawM(); });
    else if (col === 'pessoal') keepFocus(CAD.drawE);
  }
  else if (tab === 'historico' && col === 'historico') viewHist($('#main'));
  else if (tab === 'romaneio' && ['motoristas', 'transportadoras', 'pessoal', 'config'].includes(col) && !document.activeElement?.closest?.('#main')) render();
  else if (tab === 'config' && col === 'config' && !document.activeElement?.closest?.('#main')) render();
});
/* =====================================================================
   LOGIN  (usuário + senha  →  Firebase Authentication e-mail/senha)
   ===================================================================== */
const AUTH_ERR = {
  'auth/invalid-credential': 'Usuário ou senha incorretos.', 'auth/wrong-password': 'Usuário ou senha incorretos.', 'auth/user-not-found': 'Usuário ou senha incorretos.',
  'auth/invalid-email': 'Usuário inválido.', 'auth/missing-password': 'Informe a senha.', 'auth/user-disabled': 'Este usuário foi desativado.',
  'auth/too-many-requests': 'Muitas tentativas. Aguarde alguns minutos e tente de novo.', 'auth/network-request-failed': 'Sem conexão com a internet.',
  'auth/operation-not-allowed': 'Login por e-mail/senha não está ativado no Firebase (Authentication › Sign-in method).',
  'auth/invalid-api-key': 'Configuração do Firebase inválida (apiKey).', 'auth/unauthorized-domain': 'Este endereço não está autorizado no Firebase (Authentication › Settings › Authorized domains).'
};
const authMsg = e => { const c = e && e.code; return c in AUTH_ERR ? AUTH_ERR[c] : (c ? 'Erro: ' + c : ((e && e.message) || 'Erro inesperado.')); };
const toEmail = u => { u = String(u || '').trim().toLowerCase(); return u.includes('@') ? u : u.replace(/\s+/g, '') + '@' + LOGIN_DOMAIN; };
const nameOf = u => String(u.displayName || String(u.email || '').split('@')[0] || 'USUARIO').toUpperCase();

const Auth = {
  user: null, inside: false,
  boot() {
    if (Store.mode !== 'firebase') { this.showLogin(); return; }
    this.showLoading();
    const { AU, auth } = Store.fb;
    AU.onAuthStateChanged(auth, u => u ? this.enter(u) : this.leave(), e => this.showLogin(authMsg(e)));
  },
  enter(u) {
    if (this.inside && this.user && this.user.uid === u.uid) return;
    this.user = u; this.inside = true;
    Store.user = nameOf(u); LS.set('rom_user', Store.user);
    R = LS.get('rom_draft_' + Store.user, null) || { cpf: '', placa: '', conf: ['', '', ''], ajud: ['', '', ''] };
    Store.startSync();
    $('#app').classList.remove('locked'); $('#main').classList.remove('gmode');
    $('#main').innerHTML = '<div class="empty">Carregando…</div>';
    renderConn(); renderNav(); render();
    setTimeout(() => { if (Store.ready && !Store.data.motoristas.size) toast('Base vazia — use Configurações › Importar base da planilha'); }, 3000);
  },
  leave() {
    if (this.inside) { Store.stopSync(); this.inside = false; }
    this.user = null; $('#app').classList.add('locked'); this.showLogin();
  },
  async logout() {
    const { F, db, AU, auth } = Store.fb;
    try { Store.stopSync(); await AU.signOut(auth); await F.terminate(db); await F.clearIndexedDbPersistence(db); } catch (e) { console.warn(e); }
    location.reload();
  },
  showLoading() {
    const m = $('#main'); m.classList.add('gmode');
    m.innerHTML = '<div class="gcard"><h2>Verificando acesso…</h2><p class="gsub">Aguarde um instante.</p></div>';
  },
  showLogin(msg) {
    $('#app').classList.add('locked');
    const m = $('#main'); m.classList.add('gmode');
    const online = Store.mode === 'firebase';
    m.innerHTML = `<div class="gcard">
      <div class="ghead"><div class="glock" aria-hidden="true">🔒</div><div><h2>Acesso ao sistema</h2><p class="gsub">Entre com seu usuário e senha</p></div></div>
      <form id="gf" novalidate>
        <div class="fld"><label class="f" for="gu">Usuário</label><input class="in" id="gu" autocomplete="username" autocapitalize="off" spellcheck="false"></div>
        <div class="fld"><label class="f" for="gp">Senha</label>
          <div class="pw"><input class="in" id="gp" type="password" autocomplete="current-password"><button type="button" id="gs" tabindex="-1" aria-label="Mostrar senha" title="Mostrar/ocultar senha">👁</button></div>
          <div class="gcaps" id="gcaps" hidden>⚠ Caps Lock está ligado</div></div>
        <label class="gcheck"><input type="checkbox" id="gr" checked> Manter conectado neste aparelho</label>
        <div class="gerr" id="gerr" role="alert"></div>
        <button class="btn pri big full" id="gb" type="submit">Entrar</button>
      </form>
    </div>`;
    const err = t => { $('#gerr').textContent = t || ''; };
    err(msg || (online ? '' : Store.error));
    const last = LS.get('rom_lastuser', ''); $('#gu').value = last; ($('#gu').value ? $('#gp') : $('#gu')).focus();
    $('#gs').onclick = () => { const p = $('#gp'); p.type = p.type === 'password' ? 'text' : 'password'; };
    $('#gp').addEventListener('keydown', e => { if (e.getModifierState) $('#gcaps').hidden = !e.getModifierState('CapsLock'); });
    $('#gp').addEventListener('keyup', e => { if (e.getModifierState) $('#gcaps').hidden = !e.getModifierState('CapsLock'); });
    $('#gf').onsubmit = async ev => {
      ev.preventDefault(); err('');
      const u = $('#gu').value.trim(), pw = $('#gp').value;
      if (!u || !pw) return err('Informe usuário e senha.');
      if (!online) return err(Store.error || 'Sem conexão com o Firebase. Recarregue a página e tente de novo.');
      const { AU, auth } = Store.fb, btn = $('#gb'); btn.disabled = true; btn.textContent = 'Entrando…';
      try {
        await AU.setPersistence(auth, $('#gr').checked ? AU.browserLocalPersistence : AU.browserSessionPersistence).catch(() => {});
        await AU.signInWithEmailAndPassword(auth, toEmail(u), pw);
        LS.set('rom_lastuser', u);
      } catch (x) { err(authMsg(x)); btn.disabled = false; btn.textContent = 'Entrar'; $('#gp').select(); }
    };
  }
};
$('#logout').onclick = () => { if (Store.mode === 'firebase') Auth.logout(); else location.reload(); };

/* ---------- boot ---------- */
renderNav(); renderConn();
await Store.init();
await Auth.boot();
</script>
</body>
</html>
