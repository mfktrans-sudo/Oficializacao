<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oficialização · Adm Logística</title>
<style>
:root{
  --bg:#0f1319; --surface:#171d26; --surface2:#1e2630; --border:#2b3542;
  --text:#e8edf3; --dim:#97a3b4; --faint:#667386;
  --accent:#f5b53d; --accent-ink:#1a1200; --ok:#3fb97a; --err:#ef5b5b; --info:#4aa3ff;
  --mono:'Lucida Console','Consolas','Courier New',monospace;
  --sans:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px}
#app{display:flex;flex-direction:column;height:100dvh}
header{display:flex;align-items:center;gap:14px;padding:10px 18px;background:var(--surface);border-bottom:1px solid var(--border);flex-wrap:wrap}
.brand{font-weight:700;letter-spacing:.3px}.brand small{display:block;font-weight:400;color:var(--faint);font-size:11px}
nav{display:flex;gap:4px;flex:1;flex-wrap:wrap}
nav button{border:0;background:transparent;color:var(--dim);padding:8px 14px;border-radius:6px;font-weight:600}
nav button.on{background:var(--surface2);color:var(--accent)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:5px 10px;border-radius:99px;background:var(--surface2);border:1px solid var(--border);color:var(--dim);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.chip.ok .dot{background:var(--ok)}.chip.warn .dot{background:var(--accent)}.chip.err .dot{background:var(--err)}
main{flex:1;overflow:auto;padding:18px}
footer{flex:0 0 auto;text-align:center;padding:8px;font-size:11.5px;color:var(--faint);border-top:1px solid var(--border)}
h2{margin:0 0 4px;font-size:18px}.sub{color:var(--dim);margin:0 0 16px}
.grid{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}.grid>*{min-width:0}.g2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
@media(max-width:1000px){.g2{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px}
.card h3{margin:0 0 12px;font-size:12px;letter-spacing:.8px;text-transform:uppercase;color:var(--faint)}
label.f{display:block;font-size:11.5px;color:var(--dim);margin:0 0 4px;font-weight:600}
.in,select.in,textarea.in{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:9px 11px;border-radius:7px;outline:0}
.in:focus{border-color:var(--accent)}
.in[readonly]{opacity:.6}
.row{display:grid;gap:10px;margin-bottom:10px}.r2{grid-template-columns:1fr 1fr}.r3{grid-template-columns:1fr 1fr 1fr}.r4{grid-template-columns:2fr 1fr 1fr}
@media(max-width:600px){.r2,.r3,.r4{grid-template-columns:1fr}}
.btn{border:1px solid var(--border);background:var(--surface2);color:var(--text);padding:9px 14px;border-radius:7px;font-weight:600}
.btn:hover{border-color:var(--faint)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.big{padding:13px 20px;font-size:15px}
.btn.danger{color:var(--err)}
.btn.sm{padding:5px 9px;font-size:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chipbtn{border:1px solid var(--border);background:var(--surface2);color:var(--text);padding:7px 12px;border-radius:99px;font-weight:700;font-size:12.5px}
.chipbtn:hover,.chipbtn.on{border-color:var(--accent);color:var(--accent)}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--faint);padding:8px 10px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface)}
td{padding:8px 10px;border-bottom:1px solid var(--border)}
tbody tr{cursor:pointer}tbody tr:hover{background:var(--surface2)}
.tw{max-height:calc(100dvh - 300px);overflow:auto;border:1px solid var(--border);border-radius:8px}
.mono{font-family:var(--mono)}
.sugg{position:relative}
.sugg-list{position:absolute;left:0;right:0;top:100%;z-index:20;background:var(--surface2);border:1px solid var(--accent);border-radius:7px;max-height:300px;overflow:auto;margin-top:4px}
.sugg-list div{padding:8px 11px;cursor:pointer;border-bottom:1px solid var(--border)}
.sugg-list div:hover,.sugg-list div.hl{background:var(--surface)}
.sugg-list small{color:var(--dim);display:block}
/* terminal */
.term{background:#02040a;border:1px solid #1d3b78;border-radius:6px;padding:14px;overflow:auto}
.term pre{margin:0;font-family:var(--mono);font-size:14px;line-height:1.45;color:#f2f2f2;white-space:pre}
.term .box{outline:2px solid #e02f2f;outline-offset:6px;display:inline-block;padding:2px 0}
.term .hl{background:#ffff80;color:#000}
.paste{background:#02040a;border:1px solid var(--border);border-radius:6px;overflow:auto;max-height:420px}
.paste .ln{display:flex;font-family:var(--mono);font-size:13px;line-height:1.55;border-bottom:1px solid #0e1522}
.paste .n{flex:0 0 36px;text-align:right;padding-right:8px;color:var(--faint);user-select:none;background:#080c14}
.paste .t{white-space:pre;color:#f2f2f2;padding-left:8px;flex:1}
.paste .t i{color:#35507d;font-style:normal}
.paste .l{flex:0 0 52px;text-align:right;padding-right:8px;color:var(--faint);font-size:11px;user-select:none;background:#080c14}
.ruler{font-family:var(--mono);font-size:11px;color:var(--faint);white-space:pre;padding-left:44px;margin-top:4px}
.drawer-bg{position:fixed;inset:0;background:#0009;z-index:50;display:flex;justify-content:flex-end}
.drawer{width:min(520px,100%);background:var(--surface);border-left:1px solid var(--border);padding:20px;overflow:auto;height:100%}
.drawer h2{display:flex;justify-content:space-between;align-items:center}
.saved{font-size:12px;color:var(--faint)}.saved.ok{color:var(--ok)}.saved.sv{color:var(--accent)}
.toast{position:fixed;left:50%;bottom:50px;transform:translateX(-50%);background:var(--surface2);border:1px solid var(--accent);padding:10px 18px;border-radius:8px;z-index:99;box-shadow:0 8px 24px #0008}
.empty{padding:40px;text-align:center;color:var(--faint)}
.warn{color:var(--accent);font-size:12px}.bad{color:var(--err);font-size:12px}
.tools{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.tools .in{flex:1;min-width:200px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;font-size:13px}.kv b{color:var(--dim);font-weight:600}
code{background:var(--surface2);padding:1px 6px;border-radius:4px;font-family:var(--mono);font-size:12px}

/* tabela estilo planilha (cabeçalho na paleta da ferramenta) */
.sheetw{max-height:calc(100dvh - 330px);border:0;border-radius:0;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
table.sheet{table-layout:fixed}
.sheet th{background:var(--accent);color:var(--accent-ink);text-align:center;font-size:12.5px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;padding:9px 6px;border:1px solid #00000040;z-index:3}
.sheet td{padding:0;border:1px solid var(--border);vertical-align:middle}
.sheet tbody tr{cursor:default}
.sheet td input,.sheet td select{width:100%;background:transparent;border:0;outline:0;color:var(--text);padding:9px 10px;font-size:13.5px;text-overflow:ellipsis}
.sheet td.c input,.sheet td.c select{text-align:center}
.sheet td input:focus,.sheet td select:focus{background:var(--surface2);box-shadow:inset 0 0 0 2px var(--accent)}
.sheet td input.ro{opacity:.85}
.sheet td select option{background:var(--surface2)}
.sheet td.tn{padding:9px 10px;font-size:13px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet tr.newrow td{background:var(--surface2);border-bottom:2px solid var(--accent)}
.sheet tr.flash td{background:#f5b53d33;transition:background 1s}
.addbar{display:flex;gap:8px;margin-bottom:10px}.addbar .in{flex:1}.addbar .btn{white-space:nowrap}
/* ===== banner animado ===== */
.banner{flex:0 0 auto;background:#020f2b;border-bottom:1px solid var(--border);line-height:0;overflow:hidden}
.banner svg{display:block;width:100%;height:clamp(64px,10.5vw,200px)}
.bn-bar{transform-box:fill-box;transform-origin:50% 100%;animation:bnBar 2.6s ease-in-out infinite}
.bn-bar:nth-child(1){animation-duration:2.1s}
.bn-bar:nth-child(2){animation-duration:2.9s;animation-delay:-.7s}
.bn-bar:nth-child(3){animation-duration:2.4s;animation-delay:-1.3s}
.bn-bar:nth-child(4){animation-duration:3.1s;animation-delay:-.2s}
.bn-bar:nth-child(5){animation-duration:2.2s;animation-delay:-1.8s}
@keyframes bnBar{0%,100%{transform:scaleY(.3)}45%{transform:scaleY(1)}70%{transform:scaleY(.62)}}
.bn-scan{animation:bnScan 3.6s linear infinite}
@keyframes bnScan{0%{transform:translateY(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(31px);opacity:0}}
.bn-sweep{animation:bnSweep 3.2s ease-in-out infinite}
@keyframes bnSweep{0%{transform:translateX(0);opacity:0}15%{opacity:.9}85%{opacity:.9}100%{transform:translateX(88px);opacity:0}}
.bn-pulse{animation:bnPulse 2.2s ease-in-out infinite}
@keyframes bnPulse{0%,100%{opacity:.05}50%{opacity:.5}}
.bn-lamp{transform-box:fill-box;transform-origin:center;animation:bnLamp 1.8s ease-in-out infinite}
@keyframes bnLamp{0%,100%{transform:scale(.8);opacity:.75}50%{transform:scale(1.35);opacity:1}}
.bn-flare{transform-box:fill-box;transform-origin:center;animation:bnFlare 1.8s ease-in-out infinite}
@keyframes bnFlare{0%,100%{transform:scale(.7);opacity:.35}50%{transform:scale(1.3);opacity:.95}}
.bn-floor{transform-box:fill-box;transform-origin:center;animation:bnFloor 1.8s ease-in-out infinite}
@keyframes bnFloor{0%,100%{transform:scale(.85);opacity:.25}50%{transform:scale(1.15);opacity:.7}}
@media (prefers-reduced-motion:reduce){.banner *{animation:none!important}}


/* linhas neon do banner */
.nx-dot{animation:nxDot 1.8s ease-in-out infinite}
@keyframes nxDot{0%,100%{opacity:.7}50%{opacity:1}}
.nx-flow{animation:nxFlow 2.4s linear infinite}
.nx-flow2{animation-duration:3s;animation-delay:-1s}
@keyframes nxFlow{from{stroke-dashoffset:164}to{stroke-dashoffset:0}}
.nx-sweep{animation:nxSweep 5.5s ease-in-out infinite alternate}
@keyframes nxSweep{from{transform:translateX(0)}to{transform:translateX(1694px)}}
@media (prefers-reduced-motion:reduce){.nx-dot,.nx-flow,.nx-sweep{animation:none!important}}

/* ===== login ===== */
[hidden]{display:none!important}
.locked header{display:none}
main.gmode{display:flex;padding:24px 16px}
.gcard{margin:auto;width:min(400px,100%);background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:28px 26px;box-shadow:0 20px 60px #0008}
.ghead{display:flex;align-items:center;gap:13px;margin-bottom:22px}
.glock{flex:0 0 auto;width:44px;height:44px;border-radius:12px;background:var(--surface2);border:1px solid var(--border);display:grid;place-items:center;font-size:20px}
.gcard h2{margin:0;font-size:19px}
.gsub{margin:3px 0 0;color:var(--dim);font-size:12.5px}
.gcard .fld{margin-bottom:14px}
.gcard .fld .in{padding:12px;font-size:15px}
.pw{position:relative}.pw .in{padding-right:46px}
.pw button{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--dim);padding:6px 10px;font-size:16px}
.gcaps{margin-top:6px;font-size:12px;color:var(--accent)}
.gcheck{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--dim);margin:2px 0 6px;cursor:pointer}
.gerr{min-height:20px;color:var(--err);font-size:12.5px;margin:4px 0 10px;line-height:1.4}
.btn.full{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.gcard details{margin-top:18px;color:var(--dim);font-size:12.5px;line-height:1.55;border-top:1px solid var(--border);padding-top:14px}
.gcard summary{cursor:pointer;color:var(--accent);font-weight:600}
.gwarn{background:#f5b53d1a;border:1px solid #f5b53d55;color:var(--accent);border-radius:8px;padding:9px 11px;font-size:12.5px;margin-bottom:14px;line-height:1.45}
/* a tabela precisa descontar a altura do banner */
.tw{max-height:calc(100dvh - 300px - clamp(64px,10.5vw,200px))}
.sheetw{max-height:calc(100dvh - 330px - clamp(64px,10.5vw,200px))}

/* ===== indicadores ===== */
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px;min-width:0}
.kpi .kt{font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--faint);font-weight:700}
.kpi .kv2{font-size:26px;font-weight:800;margin:4px 0 2px;line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kpi .ks{font-size:12px;color:var(--dim);min-height:15px}
.hb{display:grid;gap:7px}
.hbr{display:grid;grid-template-columns:minmax(70px,32%) 1fr 52px;gap:8px;align-items:center;font-size:12.5px}
.hbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--dim)}
.hbt{height:16px;background:var(--surface2);border-radius:4px;overflow:hidden;display:flex}
.hbf{display:block;height:100%}
.hbv{text-align:right}
.lg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--dim);margin:0 0 10px}
.lg i,.dnl i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.dn{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.dnl{display:grid;gap:6px;font-size:13px}
.dnl small{color:var(--faint)}
.cc{position:relative;padding-top:16px}
.ccm{position:absolute;top:0;left:0;font-size:10.5px;color:var(--faint)}
.ccb{display:flex;align-items:flex-end;height:180px;gap:3px;border-bottom:1px solid var(--border)}
.ccc{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.ccv{font-size:10.5px;color:var(--dim);height:14px;line-height:14px;white-space:nowrap}
.ccs{width:100%;display:flex;flex-direction:column-reverse;border-radius:3px 3px 0 0;overflow:hidden}
.ccx{display:flex;gap:3px;margin-top:4px}
.ccx span{flex:1;min-width:0;font-size:10px;color:var(--faint);text-align:center;white-space:nowrap}
.indtb th,.indtb td{white-space:nowrap}
.indtb td.n,.indtb th.n{text-align:right}
.indtb tfoot td{font-weight:800;border-top:2px solid var(--border);background:var(--surface2)}
.indtb tbody tr{cursor:default}
</style>
</head>

<script type="module">
/* =====================================================================

   ===================================================================== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBPV1yC6wEwxIqSUBfs4w3iE9aD7SFaf4Q",
  authDomain: "farol-tp.firebaseapp.com",
  projectId: "farol-tp",
  storageBucket: "farol-tp.firebasestorage.app",

  appId: "1:268714309592:web:f870266ede8d47e43564ad",
  measurementId: "G-4LFYH4BQ7K"
};
/* Os usuários entram digitando só o "usuário" (ex.: rafael). Por baixo, o Firebase usa
   usuario@LOGIN_DOMAIN. Quem já tem e-mail cadastrado pode digitar o e-mail completo. */
const LOGIN_DOMAIN = "romaneio.app";
const FB_SDK = "https://www.gstatic.com/firebasejs/10.12.2/";

/* ---------- configuração do Firebase: aceita JSON ou o trecho JS copiado do console ---------- */
const parseFbCfg = t => {
  t = String(t || '').trim();
  try { return JSON.parse(t); } catch {}
  const o = {};
  for (const m of t.matchAll(/["']?(\w+)["']?\s*:\s*["']([^"']*)["']/g)) o[m[1]] = m[2];
  return o;
};

/* ---------- utilitários ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const digits = s => String(s ?? '').replace(/\D/g, '');
const fmtCpf = c => { const d = digits(c); return d.length === 11 ? `${d.slice(0,3)}.${d.slice(3,6)}.${d.slice(6,9)}-${d.slice(9)}` : (c || ''); };
const norm = s => String(s ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase();
const cpfOk = c => { const d = digits(c); if (d.length !== 11 || /^(\d)\1+$/.test(d)) return false;
  for (const n of [9, 10]) { let s = 0; for (let i = 0; i < n; i++) s += +d[i] * (n + 1 - i); const v = (s * 10) % 11 % 10; if (v !== +d[n]) return false; } return true; };
const debounce = (fn, ms) => { let t; const f = (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; f.flush = (...a) => { clearTimeout(t); fn(...a); }; return f; };
function toast(msg) { const n = document.querySelectorAll('.toast').length; const t = document.createElement('div'); t.className = 'toast'; t.style.bottom = (50 + n * 52) + 'px'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2800); }
const LS = { get: (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } }, set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };

/* ---------- layout padrão (réplica de A4:A19 da planilha) ---------- */
const DEFAULT_LAYOUT = {
  placaLen: 160,          // tamanho total da linha da placa (espaços à esquerda + placa) — igual à planilha
  confirma: '-> Deseja continuar mesmo assim? S',
  linhas: ['{cpf}','{nome}','{rg}','{transp}','{confirma}','{placa}','{conf1|.}','{conf2|.}','{conf3|.}','{ajud1|LACR}','{ajud2|LACR}','{ajud3|.}','.','.','.',''],
  linhasCurto: 12         // perfil "curto" (TEX/SEDEX copiavam A4:A15)
};

/* =====================================================================
   CAMADA DE DADOS  (Firestore em tempo real  |  modo local)
   - 1 documento por registro  → usuários diferentes não se sobrescrevem
   - gravação por CAMPO (merge) → mesma ficha, campos diferentes = sem conflito
   ===================================================================== */
const COLS = ['motoristas', 'transportadoras', 'pessoal', 'historico', 'config'];
const HIST_LIMIT = 5000;   // registros do histórico carregados (a aba Histórico continua mostrando os 150 mais recentes; os Indicadores usam todos)
const Store = {
  mode: 'local', online: true, pending: 0, user: LS.get('rom_user', ''),
  data: Object.fromEntries(COLS.map(c => [c, new Map()])),
  subs: new Set(), unsubs: [], fb: null, ready: false, error: '', loaded: {}, synced: {}, giveUp: false, giveUpTimer: null,
  on(fn) { this.subs.add(fn); return () => this.subs.delete(fn); },
  emit(col) { this.subs.forEach(f => f(col)); },
  list(col) { return [...this.data[col].values()]; },
  get(col, id) { return this.data[col].get(id); },

  async init() {
    /* a configuração vem sozinha do Firebase Hosting (/__/firebase/init.json); FIREBASE_CONFIG é só reserva */
    let cfg = FIREBASE_CONFIG;
    if (!(cfg && cfg.apiKey && cfg.projectId)) {
      try { const r = await fetch('/__/firebase/init.json', { cache: 'no-store' }); if (r.ok) cfg = await r.json(); } catch {}
    }
    if (!(cfg && cfg.apiKey && cfg.projectId)) cfg = LS.get('rom_fbcfg', null);
    if (cfg && cfg.apiKey && cfg.projectId) {
      try { await this.initFirebase(cfg); return; }
      catch (e) { console.error(e); this.error = 'Não foi possível conectar ao Firebase (' + (e.code || e.message) + ').'; }
    }
    this.initLocal();
  },
  async initFirebase(cfg) {
    const [A, F, AU] = await Promise.all([import(FB_SDK + 'firebase-app.js'), import(FB_SDK + 'firebase-firestore.js'), import(FB_SDK + 'firebase-auth.js')]);
    const app = A.initializeApp(cfg);
    const auth = AU.getAuth(app);
    const db = F.initializeFirestore(app, { localCache: F.persistentLocalCache({ tabManager: F.persistentMultipleTabManager() }) });
    this.fb = { F, db, AU, auth }; this.mode = 'firebase';
    window.addEventListener('online', () => { this.online = true; this.emit('conn'); });
    window.addEventListener('offline', () => { this.online = false; this.emit('conn'); });
    this.online = navigator.onLine;
  },
  /* a leitura em tempo real só começa DEPOIS do login aprovado */
  startSync() {
    if (this.unsubs.length || !this.fb) return;
    const { F, db } = this.fb;
    for (const col of COLS) {
      let q = F.collection(db, col);
      if (col === 'historico') q = F.query(q, F.orderBy('ts', 'desc'), F.limit(HIST_LIMIT));
      /* config: includeMetadataChanges=true para avisar quando o snapshot deixa de ser "do cache" e passa a ser do servidor */
      this.unsubs.push(F.onSnapshot(q, { includeMetadataChanges: col === 'config' }, snap => {
        const chg = snap.docChanges();
        /* batimento de presença (campo "visto") não é mudança de configuração: não dispara re-render das abas */
        const strip = o => { const r = { ...o }; delete r.visto; delete r.updatedAtLocal; return JSON.stringify(Object.keys(r).sort().map(k => [k, r[k]])); };
        let real = 0, beat = 0;
        chg.forEach(ch => {
          if (ch.type === 'removed') { this.data[col].delete(ch.doc.id); real++; return; }
          const nd = { ...ch.doc.data({ serverTimestamps: 'estimate' }), id: ch.doc.id }, pv = this.data[col].get(ch.doc.id);
          if (col === 'config' && ch.type === 'modified' && pv && strip(pv) === strip(nd)) beat++; else real++;
          this.data[col].set(ch.doc.id, nd);
        });
        const first = !this.loaded[col], flipped = !snap.metadata.fromCache && !this.synced[col];
        if (!snap.metadata.fromCache) this.synced[col] = true;
        this.loaded[col] = true; this.ready = true;
        if (col !== 'config') this.emit(col);
        else { if (first || real || flipped) this.emit('config'); if (first || real || beat || flipped) this.emit('presence'); }
      }, err => { this.error = 'Leitura negada/erro: ' + err.code; this.emit('conn'); }));
    }
    /* segurança: se o servidor não confirmar em 12 s, segue com o cache — mas SEM liberar acesso total */
    clearTimeout(this.giveUpTimer);
    this.giveUpTimer = setTimeout(() => { if (!this.synced.config) { this.giveUp = true; this.emit('config'); } }, 12000);
  },
  stopSync() {
    this.unsubs.forEach(u => { try { u(); } catch {} }); this.unsubs = [];
    COLS.forEach(c => this.data[c].clear()); this.ready = false; this.loaded = {}; this.synced = {}; this.giveUp = false; clearTimeout(this.giveUpTimer);
  },
  initLocal() {
    this.mode = 'local';
    const load = () => { for (const c of COLS) { this.data[c] = new Map((LS.get('rom_local_' + c, []) || []).map(r => [r.id, r])); } this.ready = true; COLS.forEach(c => this.emit(c)); };
    load();
    window.addEventListener('storage', e => { if (e.key && e.key.startsWith('rom_local_')) load(); });
  },
  persistLocal(col) { LS.set('rom_local_' + col, [...this.data[col].values()]); },

  /* grava SOMENTE os campos alterados (merge) */
  async set(col, id, patch) {
    const meta = { updatedBy: this.user || 'anon' };
    const prev = this.data[col].get(id) || { id };
    this.data[col].set(id, { ...prev, ...patch, ...meta, id, updatedAtLocal: Date.now() });
    this.emit(col);
    if (this.mode === 'local') { this.persistLocal(col); return; }
    const { F, db } = this.fb; this.pending++; this.emit('conn');
    try { await F.setDoc(F.doc(db, col, id), { ...patch, ...meta, updatedAt: F.serverTimestamp() }, { merge: true }); }
    catch (e) { this.error = 'Erro ao salvar: ' + (e.code || e.message); toast(this.error); }
    finally { this.pending--; this.emit('conn'); }
  },
  async add(col, obj) {
    const id = 'h' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    if (this.mode === 'local') { this.data[col].set(id, { ...obj, id, ts: Date.now() }); this.persistLocal(col); this.emit(col); return id; }
    const { F, db } = this.fb; this.pending++; this.emit('conn');
    try { await F.setDoc(F.doc(db, col, id), { ...obj, ts: F.serverTimestamp() }); } finally { this.pending--; this.emit('conn'); }
    return id;
  },
  async del(col, id) {
    this.data[col].delete(id); this.emit(col);
    if (this.mode === 'local') { this.persistLocal(col); return; }
    const { F, db } = this.fb; this.pending++; this.emit('conn');
    try { await F.deleteDoc(F.doc(db, col, id)); } finally { this.pending--; this.emit('conn'); }
  },
  async bulk(col, items, idFn) {   // importação em lote (500 por commit)
    if (this.mode === 'local') { items.forEach(o => this.data[col].set(idFn(o), { ...o, id: idFn(o) })); this.persistLocal(col); this.emit(col); return; }
    const { F, db } = this.fb; this.pending++; this.emit('conn');
    try {
      for (let i = 0; i < items.length; i += 400) {
        const b = F.writeBatch(db);
        items.slice(i, i + 400).forEach(o => b.set(F.doc(db, col, idFn(o)), { ...o, updatedBy: this.user || 'import', updatedAt: F.serverTimestamp() }, { merge: true }));
        await b.commit();
      }
    } finally { this.pending--; this.emit('conn'); }
  }
};

const idOf = code => String(code || '').replace(/\u00a0/g, ' ').trim().toUpperCase().replace(/[\/\s]+/g, '');
const transpName = code => { const t = Store.get('transportadoras', idOf(code)); return t ? t.nome : ''; };
/* layout salvo com as linhas 7-12 antigas (., ., ., LACR, LACR, .) = valores fixos: troca pelos campos da Equipe (vazio mantém o valor antigo) */
const EQUIPE_ANTIGA = ['.', '.', '.', 'LACR', 'LACR', '.'], EQUIPE_NOVA = ['{conf1|.}', '{conf2|.}', '{conf3|.}', '{ajud1|LACR}', '{ajud2|LACR}', '{ajud3|.}'];
const withEquipe = ls => (ls.length >= 12 && EQUIPE_ANTIGA.every((v, i) => String(ls[6 + i]).trim() === v)) ? [...ls.slice(0, 6), ...EQUIPE_NOVA, ...ls.slice(12)] : ls;
const layout = () => { const c = Store.get('config', 'layout'); return { ...DEFAULT_LAYOUT, ...(c ? { placaLen: c.placaLen ?? DEFAULT_LAYOUT.placaLen, confirma: c.confirma ?? DEFAULT_LAYOUT.confirma, linhasCurto: c.linhasCurto ?? DEFAULT_LAYOUT.linhasCurto, linhas: c.linhasTxt ? withEquipe(String(c.linhasTxt).replace(/\r/g, '').split('\n')) : DEFAULT_LAYOUT.linhas } : {}) }; };
const equipe = tipo => Store.list('pessoal').filter(p => p.tipo === tipo && p.ativo !== false).map(p => p.nome).sort((a, b) => a.localeCompare(b, 'pt'));

/* =====================================================================

   ===================================================================== */
function buildPaste(R, drv) {
  const L = layout();
  const placa = (R.placa || '').toUpperCase();
  const map = {
    cpf: drv ? digits(drv.cpf) : '', nome: drv ? drv.nome : '', rg: drv ? drv.rg : '', transp: drv ? drv.transp : '',
    transp_nome: drv ? transpName(drv.transp) : '', confirma: L.confirma,
    placa: placa ? placa.padStart(Math.max(L.placaLen, placa.length), ' ') : '',
    conf1: R.conf[0], conf2: R.conf[1], conf3: R.conf[2], ajud1: R.ajud[0], ajud2: R.ajud[1], ajud3: R.ajud[2]
  };
  let lines = L.linhas.map(t => t.replace(/\{(\w+)(?:\|([^}]*))?\}/g, (_, k, fb) => { const v = map[k]; return (v !== undefined && v !== null && v !== '') ? v : (fb ?? ''); }));
  if (drv && drv.perfil === 'curto') lines = lines.slice(0, L.linhasCurto);
  return lines;
}
const pasteText = lines => lines.join('\r\n') + '\r\n';

/* ---------- espelho da tela do sistema ---------- */

/* ---------- ACESSO: perfis (Administrador / Restrito) e abas liberadas ----------
   Guardado em config/acesso_<login>. Enquanto NÃO existir nenhum administrador, todos têm acesso total
   (assim ninguém fica trancado para fora). Depois do primeiro administrador, quem não estiver
   listado como administrador vê só as abas liberadas (padrão: Romaneio e Cadastro). */
const ACC_TABS = [['romaneio', 'Romaneio'], ['cadastro', 'Cadastro'], ['historico', 'Histórico'], ['indicadores', 'Indicadores']];
const ACC_DEFAULT = ['romaneio', 'cadastro'];
const ALL_TABS = ['romaneio', 'cadastro', 'historico', 'indicadores', 'config'];
const acKey = s => String(s || '').trim().toLowerCase().replace(/@romaneio\.app$/, '').replace(/[^a-z0-9@._-]+/g, '_');
const myKey = () => acKey(Auth.user ? Auth.user.email : Store.user);
const acList = () => Store.list('config').filter(c => String(c.id).startsWith('acesso_'));
function access() {
  if (Store.mode === 'local') return { ready: true, adm: true, open: true, tabs: ALL_TABS };
  if (!Store.loaded.config) return { ready: false, adm: false, open: false, tabs: [] };
  /* O 1º snapshot da config pode vir do cache / da própria escrita local (só o doc do usuário, sem nenhum administrador).
     Decidir a permissão com isso liberava TODAS as abas até o servidor responder. Agora, online, espera a confirmação do servidor. */
  if (Store.online && !Store.synced.config && !Store.giveUp) return { ready: false, adm: false, open: false, tabs: [] };
  const list = acList(), confirmed = !!Store.synced.config;
  /* "ninguém é administrador ainda → acesso total" só vale com a lista CONFIRMADA pelo servidor; sem confirmação (offline) fica restrito */
  if (!list.some(a => a.role === 'adm') && confirmed) return { ready: true, adm: true, open: true, tabs: ALL_TABS };
  const me = list.find(a => a.id === 'acesso_' + myKey());
  if (me && me.role === 'adm' && list.some(a => a.role === 'adm')) return { ready: true, adm: true, open: false, tabs: ALL_TABS };
  let t = me && Array.isArray(me.tabs) ? me.tabs.filter(k => ACC_TABS.some(x => x[0] === k)) : ACC_DEFAULT;
  if (!t.length) t = ['romaneio'];
  return { ready: true, adm: false, open: false, tabs: t };
}
const visibleTabs = () => { const a = access(); return TABS.filter(([k]) => a.tabs.includes(k)); };

/* ---------- PRESENÇA: quem está online ----------
   Cada usuário "bate o ponto" a cada 45 s no próprio registro config/acesso_<login> (campo visto).
   Online = sinal nos últimos 150 s. Não usa coleção nova (evita depender de regras do Firestore). */
const ONLINE_MS = 150000, BEAT_MS = 45000;
const Presence = {
  timer: null, tick: null,
  online() { const lim = Date.now() - ONLINE_MS; return acList().filter(a => a.visto && a.visto > lim); },
  async beat(val) {
    const k = myKey(); if (!k || Store.mode !== 'firebase' || !Auth.inside || !Store.fb) return;
    const { F, db } = Store.fb;
    try { await F.setDoc(F.doc(db, 'config', 'acesso_' + k), { login: k, visto: val === undefined ? Date.now() : val }, { merge: true }); } catch {}
  },
  start() {
    this.stop(); this.beat();
    this.timer = setInterval(() => this.beat(), BEAT_MS);
    this.tick = setInterval(() => Store.emit('presence'), 30000);   // expira quem parou de dar sinal
  },
  stop() { clearInterval(this.timer); clearInterval(this.tick); this.timer = this.tick = null; },
  async off() { this.stop(); await this.beat(0); }
};
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') Presence.beat(); });
window.addEventListener('pagehide', () => { Presence.beat(0); });
function renderOnline() {
  const el = $('#onl'); if (!el) return;
  if (Store.mode !== 'firebase' || !Auth.inside || !Store.loaded.config) { el.style.display = 'none'; return; }
  const on = Presence.online();
  el.style.display = ''; $('#onlTxt').textContent = on.length + ' online';
  el.title = on.map(a => a.login || String(a.id).slice(7)).sort().join(', ');
}
function wireOnline() {
  const card = $('#onCard'); if (!card) return;
  const draw = () => {
    const now = Date.now(), lim = now - ONLINE_MS, me = myKey();
    const last = a => a.visto || a.ultimoAcesso || 0;
    const rows = acList().map(a => ({ k: String(a.id).slice(7), a, on: !!(a.visto && a.visto > lim) })).sort((x, y) => (y.on - x.on) || (last(y.a) - last(x.a)));
    const n = rows.filter(r => r.on).length;
    const ago = t => { if (!t) return '—'; const sec = Math.max(0, Math.round((now - t) / 1000)); if (sec < 60) return 'agora'; if (sec < 3600) return 'há ' + Math.floor(sec / 60) + ' min'; if (sec < 86400) return 'há ' + Math.floor(sec / 3600) + ' h'; return new Date(t).toLocaleString('pt-BR'); };
    card.innerHTML = `<h3>Usuários online</h3>
      <p class="sub" style="font-size:12.5px"><b>${n}</b> online agora, de ${rows.length} usuário(s) já cadastrados. Conta como online quem está com o sistema aberto (sinal a cada 45 s).</p>
      <div class="tw" style="max-height:340px"><table><thead><tr><th>Usuário</th><th>Status</th><th>Visto por último</th></tr></thead><tbody>${rows.length ? rows.map(r => `<tr style="cursor:default"><td><b>${esc(r.a.login || r.k)}</b>${r.k === me ? ' <small class="warn">(você)</small>' : ''}<br><small style="color:var(--faint)">${esc(r.a.nome || '')}</small></td><td><span class="chip ${r.on ? 'ok' : ''}"><span class="dot"></span>${r.on ? 'Online' : 'Offline'}</span></td><td>${ago(last(r.a))}</td></tr>`).join('') : '<tr><td colspan="3" style="color:var(--faint)">Nenhum usuário cadastrado ainda.</td></tr>'}</tbody></table></div>`;
  };
  PRESV = draw; draw();
}

  const ed = $('#edDrv'); if (ed) ed.onclick = () => { if (!canTab('cadastro')) return toast('Você não tem acesso à aba Cadastro'); mq = R.cpf; mf = ''; mpage = 0; tab = 'cadastro'; LS.set('rom_tab', tab); renderNav(); render(); };
  const up = $('#usePl'); if (up) up.onclick = e => { e.preventDefault(); R.placa = drv.placa; saveDraft(); render(); };
  $('#savePlaca').onclick = () => { if (drv && R.placa) { Store.set('motoristas', drv.cpf, { placa: R.placa }); toast('Placa gravada no cadastro'); } };
  $('#clear').onclick = () => { R = { cpf: '', placa: '', conf: ['', '', ''], ajud: ['', '', ''] }; saveDraft(); render(); };
  $('#copy').onclick = async () => {
    const d = Store.get('motoristas', R.cpf); if (!d) return;
    const txt = pasteText(buildPaste(R, d));
    try { await navigator.clipboard.writeText(txt); } catch { const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
    await Store.add('historico', { cpf: d.cpf, nome: d.nome, transp: d.transp, transpNome: transpName(d.transp), placa: R.placa, conf: R.conf.filter(Boolean), ajud: R.ajud.filter(Boolean), usuario: Store.user || 'anon' });
    toast('Copiado! Cole no sistema (Ctrl+V).');
  };
}

const timers = {};
function autosave(col, id, k, val) {
  const key = col + '|' + id + '|' + k; clearTimeout(timers[key]); svst('Digitando…');

}
/* redesenha sem perder o foco nem o que está sendo digitado */
function keepFocus(fn) {

  if (a && a.matches && a.matches('#cad tbody input, #cad tbody select')) { const tr = a.closest('tr'); s = { t: a.closest('table').id, id: tr.dataset.id, k: a.dataset.k, p: a.selectionStart, v: a.value }; }

}

  if (adm) m.querySelectorAll('tbody tr[data-id]').forEach(tr => {
    const id = tr.dataset.id;
    tr.querySelector('[data-ed]').onclick = () => editHist(id);
    tr.querySelector('[data-rm]').onclick = async () => {
      const r = Store.get('historico', id); if (!r) return;
      if (confirm(`Excluir este registro do histórico?\n${r.nome || ''} · ${r.placa || ''}\nA exclusão vale para TODOS os usuários e altera os indicadores.`)) { await Store.del('historico', id); toast('Registro excluído'); }
    };
  });
}
const tms = t => t && t.toMillis ? t.toMillis() : (t instanceof Date ? t.getTime() : (typeof t === 'number' ? t : 0));

/* painel de edição de um registro do histórico */
function editHist(id) {
  const r = Store.get('historico', id); if (!r) return;
  const pad = n => String(n).padStart(2, '0');
  const d = new Date(tms(r.ts) || Date.now());
  const dtv = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
  const conf = equipe('conferente'), aj = equipe('ajudante');
  const opts = (arr, v) => `<option value=""></option>` + arr.map(n => `<option ${n === v ? 'selected' : ''}>${esc(n)}</option>`).join('') + (v && !arr.includes(v) ? `<option selected>${esc(v)}</option>` : '');
  const bg = document.createElement('div'); bg.className = 'drawer-bg';
  bg.innerHTML = `<div class="drawer"><h2>Editar registro <button class="btn sm" id="hxX" type="button">✕</button></h2>

    <div class="row r2"><div><label class="f">Usuário (quem gerou)</label><input class="in" id="hxUser" value="${esc(r.usuario)}"></div><div><label class="f">Placa</label><input class="in mono" id="hxPlaca" maxlength="8" value="${esc(r.placa)}"></div></div>
    <div class="row"><div><label class="f">Motorista</label><input class="in" id="hxNome" value="${esc(r.nome)}"></div></div>
    <div class="row r2"><div><label class="f">CPF</label><input class="in mono" id="hxCpf" maxlength="14" value="${fmtCpf(r.cpf)}"></div><div><label class="f">Código da transportadora</label><input class="in mono" id="hxTransp" list="hxDl" value="${esc(r.transp)}"></div></div>
    <datalist id="hxDl">${Store.list('transportadoras').sort(byName).map(t => `<option value="${esc(t.id)}">${esc(t.nome)}</option>`).join('')}</datalist>
    <div class="row r3">${[0, 1, 2].map(i => `<div><label class="f">Conferente ${i + 1}</label><select class="in" data-hc="${i}">${opts(conf, (r.conf || [])[i])}</select></div>`).join('')}</div>
    <div class="row r3">${[0, 1, 2].map(i => `<div><label class="f">Ajudante ${i + 1}</label><select class="in" data-ha="${i}">${opts(aj.length ? aj : conf, (r.ajud || [])[i])}</select></div>`).join('')}</div>
    <div style="display:flex;gap:10px;margin-top:14px"><button class="btn pri big" id="hxSave" type="button">Salvar alterações</button><button class="btn big" id="hxCancel" type="button">Cancelar</button></div></div>`;
  document.body.appendChild(bg);
  const close = () => bg.remove();
  bg.onclick = e => { if (e.target === bg) close(); };
  bg.querySelector('#hxX').onclick = bg.querySelector('#hxCancel').onclick = close;
  bg.querySelector('#hxSave').onclick = async () => {
    const g = k => bg.querySelector(k).value;
    const ms = new Date(g('#hxTs')).getTime(); if (!ms) return toast('Informe data e hora válidas');
    const nome = g('#hxNome').trim().toUpperCase(); if (!nome) return toast('Informe o nome do motorista');
    const dg = digits(g('#hxCpf')); if (dg.length < 8 || dg.length > 11) return toast('Informe um CPF válido (11 dígitos)');
    const code = idOf(g('#hxTransp'));
    const patch = {
      ts: Store.mode === 'local' ? ms : new Date(ms), usuario: (g('#hxUser').trim() || r.usuario || 'anon').toUpperCase(), nome, cpf: dg.padStart(11, '0'),
      transp: code, transpNome: transpName(code) || (code === r.transp ? (r.transpNome || '') : ''), placa: g('#hxPlaca').trim().toUpperCase(),
      conf: [...bg.querySelectorAll('[data-hc]')].map(x => x.value).filter(Boolean), ajud: [...bg.querySelectorAll('[data-ha]')].map(x => x.value).filter(Boolean)
    };
    close(); await Store.set('historico', id, patch); toast('Registro atualizado ✓');
  };
}

/* ---------- INDICADORES (produtividade por usuário e turno) ----------
   Fonte: histórico de romaneios copiados. Cada registro é classificado no turno pelo horário em que foi gerado.
   Turnos que viram a meia-noite pertencem ao dia em que começaram ("dia operacional"). */
const DEFAULT_TURNOS = [{ nome: 'Manhã', ini: '06:00', fim: '14:00' }, { nome: 'Tarde', ini: '14:00', fim: '22:00' }, { nome: 'Noite', ini: '22:00', fim: '06:00' }];
const turnos = () => {
  const c = Store.get('config', 'turnos');
  const l = c && Array.isArray(c.lista) && c.lista.length ? c.lista : DEFAULT_TURNOS;
  return l.map((t, i) => ({ nome: (t && t.nome) || ('Turno ' + (i + 1)), ini: (t && t.ini) || '00:00', fim: (t && t.fim) || '00:00' }));
};
const hm = x => { const [h, m] = String(x).split(':').map(Number); return (h || 0) * 60 + (m || 0); };
const FORA = 'Fora de turno', FORA_COR = '#667386';
const TCOL = ['#4aa3ff', '#f5b53d', '#a78bfa', '#3fb97a', '#ef5b5b'];
const UCOL = ['#4aa3ff', '#f5b53d', '#3fb97a', '#ef5b5b', '#a78bfa', '#22d3ee', '#f472b6', '#fb923c'];
const PAUSA_MIN = 60;   // intervalos maiores que isso são pausa e não entram no "intervalo médio"
const turnoCor = nome => { const i = turnos().findIndex(t => t.nome === nome); return i >= 0 ? TCOL[i % TCOL.length] : FORA_COR; };
function turnoOf(d) {
  const min = d.getHours() * 60 + d.getMinutes();
  for (const t of turnos()) {
    const a = hm(t.ini), b = hm(t.fim), cruza = a >= b;
    if (cruza ? (min >= a || min < b) : (min >= a && min < b)) return { nome: t.nome, dia: new Date(d.getFullYear(), d.getMonth(), d.getDate() - (cruza && min < b ? 1 : 0)) };

}
const dkey = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const fdia = d => d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
const nf = (n, d = 0) => (n || 0).toLocaleString('pt-BR', { minimumFractionDigits: d, maximumFractionDigits: d });
const hh = h => h == null ? '—' : String(h).padStart(2, '0') + 'h';
const WDN = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
let IND = Object.assign({ per: '7d', turno: '', user: '', de: '', ate: '' }, LS.get('rom_ind', {}));

function indWindow() {
  const hoje = turnoOf(new Date()).dia; let a, b;
  if (IND.per === 'hoje') a = b = hoje;
  else if (IND.per === 'ontem') a = b = addDays(hoje, -1);
  else if (IND.per === '30d') { a = addDays(hoje, -29); b = hoje; }
  else if (IND.per === 'mes') { a = new Date(hoje.getFullYear(), hoje.getMonth(), 1); b = hoje; }
  else if (IND.per === 'custom') { a = IND.de ? new Date(IND.de + 'T00:00') : addDays(hoje, -6); b = IND.ate ? new Date(IND.ate + 'T00:00') : hoje; if (a > b) [a, b] = [b, a]; }
  else { a = addDays(hoje, -6); b = hoje; }

}
function indRecs() {
  return Store.list('historico').map(r => {
    const ms = tms(r.ts); if (!ms) return null;
    const d = new Date(ms), t = turnoOf(d);
    return { ms, h: d.getHours(), wd: t.dia.getDay(), dia: t.dia, dk: dkey(t.dia), turno: t.nome, user: String(r.usuario || '—').toUpperCase(), cpf: r.cpf || '', placa: r.placa || '', transp: r.transpNome || r.transp || '—', conf: r.conf || [], ajud: r.ajud || [] };

}
function calc(L) {
  const inc = (m, k, v = 1) => m.set(k, (m.get(k) || 0) + v);
  const o = { total: L.length, user: new Map(), turno: new Map(), ut: new Map(), day: new Map(), dayT: new Map(), dayU: new Map(), hour: Array(24).fill(0), wd: Array(7).fill(0), transp: new Map(), equipe: new Map(), cpfs: new Set(), placas: new Set(), buckets: new Set(), comPlaca: 0, comConf: 0, pessoas: 0 };
  for (const x of L) {
    inc(o.user, x.user); inc(o.turno, x.turno); inc(o.ut, x.user + '\u0001' + x.turno); inc(o.day, x.dk); inc(o.dayT, x.dk + '\u0001' + x.turno); inc(o.dayU, x.dk + '\u0001' + x.user);
    o.hour[x.h]++; o.wd[x.wd]++; inc(o.transp, x.transp);

    if (x.cpf) o.cpfs.add(x.cpf); if (x.placa) { o.placas.add(x.placa); o.comPlaca++; }

function perUser(L) {
  const g = new Map(); L.forEach(x => { if (!g.has(x.user)) g.set(x.user, []); g.get(x.user).push(x); });
  return [...g.entries()].map(([user, a]) => {
    a.sort((p, q) => p.ms - q.ms);
    const days = new Set(a.map(x => x.dk)), bk = new Set(a.map(x => x.dk + '|' + x.h)), tn = new Map(), hr = Array(24).fill(0), drv = new Set();
    let gs = 0, gn = 0, pl = 0, cf = 0;
    a.forEach((x, i) => {
      tn.set(x.turno, (tn.get(x.turno) || 0) + 1); hr[x.h]++; if (x.cpf) drv.add(x.cpf); if (x.placa) pl++; if (x.conf.length) cf++;
      if (i) { const p = a[i - 1]; if (p.dk === x.dk && p.turno === x.turno) { const gm = (x.ms - p.ms) / 6e4; if (gm <= PAUSA_MIN) { gs += gm; gn++; } } }
    });
    const top = [...tn.entries()].sort((p, q) => q[1] - p[1])[0];
    return { user, n: a.length, dias: days.size, perDia: a.length / days.size, perHora: a.length / bk.size, gs, gn, gap: gn ? gs / gn : null, turno: top ? top[0] : '—', pico: hr.indexOf(Math.max(...hr)), drv: drv.size, pPlaca: pl / a.length, pConf: cf / a.length };
  }).sort((p, q) => q.n - p.n);
}
function perTurno(L) {
  const names = turnos().map(t => t.nome); if (L.some(x => x.turno === FORA)) names.push(FORA);
  return [...new Set(names)].map(nm => {
    const a = L.filter(x => x.turno === nm), t = turnos().find(t => t.nome === nm);

    a.forEach(x => { us.set(x.user, (us.get(x.user) || 0) + 1); hr[x.h]++; });

    return { nome: nm, hor: t ? `${t.ini}–${t.fim}` : '—', n: a.length, users: us.size, perDia: days.size ? a.length / days.size : 0, perHora: bk.size ? a.length / bk.size : 0, pico: a.length ? hr.indexOf(Math.max(...hr)) : null, top: top ? top[0] : '—' };
  });
}

/* ----- componentes de gráfico (HTML/SVG puro, sem bibliotecas externas) ----- */
const EMPTYC = '<div class="empty" style="padding:24px">Sem dados no período.</div>';

const hstack = rows => { const mx = Math.max(1, ...rows.map(r => r.tot)); return rows.length ? `<div class="hb">${rows.map(r => `<div class="hbr"><span class="hbl" title="${esc(r.l)}">${esc(r.l)}</span><span class="hbt">${r.segs.filter(s => s.v).map(s => `<span class="hbf" title="${esc(s.t)}: ${s.v}" style="width:${(s.v / mx * 100).toFixed(2)}%;background:${s.c}"></span>`).join('')}</span><b class="hbv">${nf(r.tot)}</b></div>`).join('')}</div>` : EMPTYC; };
const legend = names => `<div class="lg">${names.map(n => `<span><i style="background:${turnoCor(n)}"></i>${esc(n)}</span>`).join('')}</div>`;
const cols = items => {
  const mx = Math.max(1, ...items.map(i => i.tot)), step = Math.ceil(items.length / 16), few = items.length <= 16;
  return `<div class="cc"><div class="ccm">${nf(mx)}</div><div class="ccb">${items.map(i => `<div class="ccc" title="${esc(i.l)}: ${nf(i.tot)}"><span class="ccv">${few && i.tot ? nf(i.tot) : ''}</span><div class="ccs" style="height:calc((100% - 14px) * ${(i.tot / mx).toFixed(4)})">${i.segs.filter(s => s.v).map(s => `<div style="flex:${s.v};background:${s.c}"></div>`).join('')}</div></div>`).join('')}</div><div class="ccx">${items.map((i, k) => `<span>${k % step === 0 ? esc(i.l) : ''}</span>`).join('')}</div></div>`;
};
const donut = items => {
  const tot = items.reduce((a, i) => a + i.v, 0); if (!tot) return EMPTYC;
  const R = 52, C = 2 * Math.PI * R; let off = 0;
  const arcs = items.filter(i => i.v).map(i => { const len = i.v / tot * C; const t = `<circle r="${R}" cx="70" cy="70" fill="none" stroke="${i.c}" stroke-width="22" stroke-dasharray="${len.toFixed(2)} ${(C - len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 70 70)"><title>${esc(i.l)}: ${i.v}</title></circle>`; off += len; return t; }).join('');

};
const lines = (days, series) => {

      <div class="card"><h3>Por dia da semana</h3>${cWd}</div>
      <div class="card"><h3>Top transportadoras</h3>${cTr}</div>
      <div class="card"><h3>Equipe mais presente (conferentes e ajudantes)</h3>${cEq}</div>
    </div>
    <div class="card" style="margin-top:16px"><h3>Produtividade por usuário</h3><div class="tw" style="max-height:none"><table class="indtb"><thead><tr><th>Usuário</th><th class="n">Romaneios</th><th class="n">% do total</th><th class="n">Dias ativos</th><th class="n">Média/dia</th><th class="n">Média/hora ativa</th><th class="n">Intervalo médio</th><th>Turno principal</th><th class="n">Hora de pico</th><th class="n">Motoristas únicos</th><th class="n">% com placa</th><th class="n">% com conferente</th></tr></thead><tbody>${rowsU}</tbody><tfoot>${totRow}</tfoot></table></div></div>
    <div class="card" style="margin-top:16px"><h3>Resumo por turno</h3><div class="tw" style="max-height:none"><table class="indtb"><thead><tr><th>Turno</th><th>Horário</th><th class="n">Romaneios</th><th class="n">% do total</th><th class="n">Usuários</th><th class="n">Média/dia</th><th class="n">Média/hora ativa</th><th class="n">Hora de pico</th><th>Quem mais produziu</th></tr></thead><tbody>${rowsT}</tbody></table></div></div>`;
  };
  const save = () => LS.set('rom_ind', IND);
  $('#iP').onchange = e => { IND.per = e.target.value; $('#iC').hidden = IND.per !== 'custom'; save(); draw(); };
  $('#iDe').onchange = e => { IND.de = e.target.value; save(); draw(); };
  $('#iAte').onchange = e => { IND.ate = e.target.value; save(); draw(); };
  $('#iT').onchange = e => { IND.turno = e.target.value; save(); draw(); };
  $('#iU').onchange = e => { IND.user = e.target.value; save(); draw(); };
  $('#iX').onclick = () => {
    if (!lastRows) return toast('Nada para exportar neste período');
    const csv = lastRows.map(r => r.map(x => String(x ?? '').replace(/;/g, ',')).join(';')).join('\r\n');
    const el = document.createElement('a'); el.href = URL.createObjectURL(new Blob(['\ufeff' + csv], { type: 'text/csv' })); el.download = 'indicadores_usuarios.csv'; el.click();
  };
  INDV = draw; draw();
}

/* ---------- CONFIGURAÇÕES ---------- */
function viewConfig(m) {
  const L = layout();
  const cfgDoc = Store.get('config', 'layout');
  m.innerHTML = `<h2>Configurações</h2><p class="sub">Layout do texto de colagem (compartilhado por todos) e importação/exportação.</p>
  <div class="grid g2"><div class="grid">
  <div class="card"><h3>Layout do texto de colagem (compartilhado)</h3>
    <div class="row r2"><div><label class="f">Tamanho total da linha da placa</label><input class="in" id="cLen" type="number" min="8" value="${L.placaLen}"></div>
    <div><label class="f">Linhas do perfil “curto”</label><input class="in" id="cCur" type="number" min="1" value="${L.linhasCurto}"></div></div>
    <div class="row"><div><label class="f">Texto da confirmação</label><input class="in" id="cConf" value="${esc(L.confirma)}"></div></div>
    <div class="row"><div><label class="f">Sequência de linhas (uma por linha)</label><textarea class="in mono" id="cSeq" rows="17">${esc(L.linhas.join('\n'))}</textarea></div></div>
    <p class="sub" style="font-size:12px">Campos: <code>{cpf}</code> <code>{nome}</code> <code>{rg}</code> <code>{transp}</code> <code>{transp_nome}</code> <code>{confirma}</code> <code>{placa}</code> <code>{conf1}</code> <code>{conf2}</code> <code>{conf3}</code> <code>{ajud1}</code> <code>{ajud2}</code> <code>{ajud3}</code>. Qualquer outro texto (como <code>.</code> ou <code>LACR</code>) é enviado literalmente.</p>
    <div style="display:flex;gap:10px;align-items:center"><span class="saved" id="lsv">${cfgDoc ? 'Layout personalizado' : 'Layout padrão (igual à planilha)'}</span><button class="btn sm" id="cReset">Restaurar padrão</button></div></div>
  </div><div class="grid">
  <div class="card"><h3>Dados</h3>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn" id="seedBtn">Importar base da planilha OFICIALIZAÇÃO 2026</button>
      <button class="btn" id="exCsv">Exportar motoristas (CSV)</button>
      <button class="btn" id="imCsv">Importar CSV</button><input type="file" id="imF" accept=".csv,.txt" hidden></div>
    <p class="sub" style="font-size:12px;margin-top:10px">CSV com colunas: CPF;NOME;RG;CODIGO;PLACA;ATALHO (separador ; ou ,). CPFs existentes são atualizados, os demais criados.</p>
    <div class="kv" style="margin-top:8px"><b>Motoristas</b><span>${Store.data.motoristas.size}</span><b>Transportadoras</b><span>${Store.data.transportadoras.size}</span><b>Equipe</b><span>${Store.data.pessoal.size}</span></div></div>
  </div></div>
  <div class="card" id="onCard" style="margin-top:16px"></div>
  <div class="card" id="accCard" style="margin-top:16px"></div>
  <div class="card" id="turCard" style="margin-top:16px"></div>`;
  wireOnline(); wireAcesso(); wireTurnos();
  const saveLayout = debounce(async () => { await Store.set('config', 'layout', { placaLen: +$('#cLen').value || 160, linhasCurto: +$('#cCur').value || 12, confirma: $('#cConf').value, linhasTxt: $('#cSeq').value }); $('#lsv').textContent = 'Layout salvo ✓'; }, 700);
  ['#cLen', '#cCur', '#cConf', '#cSeq'].forEach(s => $(s).oninput = () => { $('#lsv').textContent = 'Salvando…'; saveLayout(); });
  $('#cReset').onclick = async () => { if (confirm('Voltar ao layout padrão para todos?')) { await Store.del('config', 'layout'); render(); } };
  $('#seedBtn').onclick = async () => {
    const sd = JSON.parse(document.getElementById('seedData').textContent);
    if (!confirm(`Importar ${sd.motoristas.length} motoristas, ${sd.transportadoras.length} transportadoras e ${sd.pessoal.length} conferentes?\nRegistros já existentes (mesmo CPF/código) serão ATUALIZADOS.`)) return;
    toast('Importando…');
    await Store.bulk('transportadoras', sd.transportadoras.map(t => ({ ...t, id: idOf(t.codigo) })), o => o.id);
    await Store.bulk('motoristas', sd.motoristas.map(d => ({ ...d, transp: idOf(d.transp) })), o => o.cpf);
    const have = new Set(Store.list('pessoal').map(p => p.nome));
    await Store.bulk('pessoal', sd.pessoal.filter(p => !have.has(p.nome)).map((p, i) => ({ ...p, ativo: true, id: 'p' + Date.now().toString(36) + i })), o => o.id);
    toast('Importação concluída'); render();
  };
  $('#exCsv').onclick = () => { const rows = ['CPF;NOME;RG;CODIGO;PLACA;ATALHO', ...Store.list('motoristas').map(d => [d.cpf, d.nome, d.rg, d.transp, d.placa, d.atalho].map(x => String(x ?? '').replace(/;/g, ',')).join(';'))]; const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['\ufeff' + rows.join('\r\n')], { type: 'text/csv' })); a.download = 'motoristas.csv'; a.click(); };
  $('#imCsv').onclick = () => $('#imF').click();
  $('#imF').onchange = async e => {
    const f = e.target.files[0]; if (!f) return; const t = (await f.text()).replace(/^\ufeff/, ''); const ls = t.split(/\r?\n/).filter(Boolean); const sep = ls[0].includes(';') ? ';' : ',';
    const hd = ls[0].split(sep).map(h => norm(h).trim()); const ix = k => hd.indexOf(k);
    const items = ls.slice(1).map(l => { const c = l.split(sep); const g = k => (c[ix(k)] || '').trim(); const cpf = digits(g('CPF')).padStart(11, '0'); return { cpf, nome: g('NOME').toUpperCase(), rg: g('RG'), transp: idOf(g('CODIGO')), placa: g('PLACA').toUpperCase(), atalho: g('ATALHO') }; }).filter(x => x.cpf.length === 11 && x.nome);
    if (!items.length) return toast('Nenhuma linha válida'); await Store.bulk('motoristas', items, o => o.cpf); toast(items.length + ' motoristas importados'); render();
  };
}

/* ---------- CONFIGURAÇÕES: acesso de usuários ---------- */
function wireAcesso() {
  const card = $('#accCard'); if (!card) return;
  const nAdm = () => acList().filter(a => a.role === 'adm').length;
  const draw = () => {
    const keep = ($('#acN') || {}).value || '';
    const list = acList().sort((a, b) => String(a.login || a.id).localeCompare(String(b.login || b.id)));
    const ac = access(), me = myKey();
    card.innerHTML = `<h3>Acesso de usuários</h3>
      <p class="sub" style="font-size:12.5px">Usuários <b>Restritos</b> veem somente as abas marcadas (padrão: Romaneio e Cadastro). <b>Administradores</b> têm acesso a tudo, inclusive Configurações, e podem editar/excluir no Histórico. Quem entrar pela primeira vez aparece aqui como Restrito.</p>
      ${ac.open ? '<div class="gwarn">Nenhum administrador definido: por enquanto <b>todos</b> os usuários têm acesso total. Marque pelo menos um como Administrador para ativar as restrições.</div>' : ''}
      <div class="addbar"><input class="in" id="acN" placeholder="Login do usuário (o que ele digita para entrar, ex.: maria)"><button class="btn pri sm" id="acAdd" type="button">+ Adicionar</button></div>
      <div class="tw" style="max-height:440px"><table><thead><tr><th>Usuário</th><th>Perfil</th><th>Abas liberadas</th><th>Último acesso</th><th></th></tr></thead><tbody>${list.map(a => {
        const k = String(a.id).slice(7), adm = a.role === 'adm', tabs = adm ? ACC_TABS.map(x => x[0]) : (Array.isArray(a.tabs) ? a.tabs : ACC_DEFAULT);
        return `<tr data-k="${esc(k)}" style="cursor:default"><td><b>${esc(a.login || k)}</b>${k === me ? ' <small class="warn">(você)</small>' : ''}<br><small style="color:var(--faint)">${esc(a.nome || '')}</small></td>
          <td><select class="in" data-role style="min-width:150px"><option value="restrito" ${adm ? '' : 'selected'}>Restrito</option><option value="adm" ${adm ? 'selected' : ''}>Administrador</option></select></td>
          <td>${ACC_TABS.map(([t, n]) => `<label class="gcheck" style="display:inline-flex;margin:0 14px 0 0"><input type="checkbox" data-tab="${t}" ${tabs.includes(t) ? 'checked' : ''} ${adm ? 'disabled' : ''}> ${n}</label>`).join('')}</td>
          <td><small>${a.ultimoAcesso ? new Date(a.ultimoAcesso).toLocaleString('pt-BR') : '—'}</small></td>
          <td><button class="btn sm danger" data-rm type="button" title="Remover da lista">✕</button></td></tr>`;
      }).join('') || '<tr><td colspan="5" class="empty">Nenhum usuário listado ainda.</td></tr>'}</tbody></table></div>`;
    if (keep) $('#acN').value = keep;
  };
  const add = async () => {
    const k = acKey($('#acN').value); if (!k) return toast('Informe o login do usuário');
    if (Store.get('config', 'acesso_' + k)) return toast('Esse usuário já está na lista');
    await Store.set('config', 'acesso_' + k, { login: k, nome: '', role: 'restrito', tabs: ACC_DEFAULT });
    $('#acN').value = ''; toast('Usuário adicionado ✓');
  };
  card.onchange = async e => {
    const tr = e.target.closest('tr[data-k]'); if (!tr) return;
    const id = 'acesso_' + tr.dataset.k, cur = Store.get('config', id) || {};
    if (e.target.matches('[data-role]')) {
      const role = e.target.value;
      if (role !== 'adm' && cur.role === 'adm' && nAdm() <= 1) { toast('Mantenha pelo menos um administrador.'); draw(); return; }
      await Store.set('config', id, { role, tabs: Array.isArray(cur.tabs) ? cur.tabs : ACC_DEFAULT });
    } else if (e.target.matches('[data-tab]')) {
      await Store.set('config', id, { tabs: [...tr.querySelectorAll('[data-tab]')].filter(x => x.checked).map(x => x.dataset.tab) });
    }
  };
  card.onclick = async e => {
    if (e.target.id === 'acAdd') return add();
    const b = e.target.closest('[data-rm]'); if (!b) return;
    const k = b.closest('tr').dataset.k, id = 'acesso_' + k, cur = Store.get('config', id) || {};
    if (cur.role === 'adm' && nAdm() <= 1) return toast('Mantenha pelo menos um administrador.');
    if (confirm(`Remover "${k}" da lista? Se ele entrar de novo, volta como Restrito.`)) { await Store.del('config', id); toast('Usuário removido da lista'); }
  };
  card.onkeydown = e => { if (e.key === 'Enter' && e.target.id === 'acN') add(); };
  ACCV = draw; draw();
}

/* ---------- CONFIGURAÇÕES: turnos (usados nos Indicadores) ---------- */
function wireTurnos() {
  const card = $('#turCard'); if (!card) return;
  const cur = turnos(), custom = !!Store.get('config', 'turnos');
  card.innerHTML = `<h3>Turnos (usados nos Indicadores)</h3>
    <p class="sub" style="font-size:12.5px">Cada romaneio copiado é classificado no turno pelo horário em que foi registrado. Turnos que viram a meia-noite (ex.: 22:00 → 06:00) pertencem ao dia em que começaram. Horário fora de qualquer turno aparece como “${FORA}”.</p>
    <div class="grid" style="gap:8px">${cur.map((t, i) => `<div class="row" style="grid-template-columns:1.4fr 1fr 1fr;margin:0"><div><label class="f">Turno ${i + 1}</label><input class="in" data-tn="${i}" data-f="nome" value="${esc(t.nome)}"></div><div><label class="f">Início</label><input class="in" type="time" data-tn="${i}" data-f="ini" value="${esc(t.ini)}"></div><div><label class="f">Fim</label><input class="in" type="time" data-tn="${i}" data-f="fim" value="${esc(t.fim)}"></div></div>`).join('')}</div>
    <div style="display:flex;gap:10px;align-items:center;margin-top:12px"><span class="saved" id="tsv">${custom ? 'Turnos personalizados' : 'Turnos padrão'}</span><button class="btn sm" id="tReset" type="button">Restaurar padrão</button></div>`;
  const save = debounce(async () => {
    const lista = [];
    card.querySelectorAll('[data-tn]').forEach(el => { (lista[+el.dataset.tn] = lista[+el.dataset.tn] || {})[el.dataset.f] = el.value; });
    if (lista.some(t => !t.ini || !t.fim)) { $('#tsv').textContent = 'Preencha início e fim de todos os turnos'; return; }
    lista.forEach((t, i) => { t.nome = (t.nome || '').trim() || ('Turno ' + (i + 1)); });
    await Store.set('config', 'turnos', { lista }); $('#tsv').textContent = 'Turnos salvos ✓';
  }, 700);
  card.querySelectorAll('[data-tn]').forEach(el => el.oninput = () => { $('#tsv').textContent = 'Salvando…'; save(); });
  $('#tReset').onclick = async () => { if (confirm('Voltar aos turnos padrão (06–14, 14–22, 22–06)?')) { await Store.del('config', 'turnos'); wireTurnos(); } };
}

/* ---------- operador ---------- */
function askUser(force) {
  if (Store.user && !force) return;
  const n = (prompt('Seu nome (aparece no histórico e nos registros):', Store.user || '') || '').trim().toUpperCase();
  if (n) { Store.user = n; LS.set('rom_user', n); R = LS.get('rom_draft_' + n, R); }
  renderConn();
}

/* ---------- boot ---------- */
let lastAcc = '';
Store.on(col => {
  renderConn();
  if (col === 'conn') return;
  if (col === 'presence') { renderOnline(); if (tab === 'config' && PRESV) PRESV(); return; }
  if (col === 'config' && Auth.inside) { const sg = JSON.stringify(access()); if (sg !== lastAcc) { lastAcc = sg; renderNav(); render(); return; } }
  if (col === 'config' && tab === 'config' && ACCV) ACCV();
  if (tab === 'cadastro' && CAD) {
    if (col === 'motoristas') keepFocus(CAD.drawM);
    else if (col === 'transportadoras') keepFocus(() => { CAD.drawDL(); CAD.drawT(); CAD.drawM(); });
    else if (col === 'pessoal') keepFocus(CAD.drawE);
  }
  else if (tab === 'historico' && col === 'historico') viewHist($('#main'));
  else if (tab === 'romaneio' && ['motoristas', 'transportadoras', 'pessoal', 'config'].includes(col) && !document.activeElement?.closest?.('#main')) render();
  else if (tab === 'config' && col === 'config' && !document.activeElement?.closest?.('#main')) render();
  else if (tab === 'indicadores' && INDV && (col === 'historico' || col === 'config')) INDV();
});
/* =====================================================================
   LOGIN  (usuário + senha  →  Firebase Authentication e-mail/senha)
   ===================================================================== */
const AUTH_ERR = {
  'auth/invalid-credential': 'Usuário ou senha incorretos.', 'auth/wrong-password': 'Usuário ou senha incorretos.', 'auth/user-not-found': 'Usuário ou senha incorretos.',
  'auth/invalid-email': 'Usuário inválido.', 'auth/missing-password': 'Informe a senha.', 'auth/user-disabled': 'Este usuário foi desativado.',
  'auth/too-many-requests': 'Muitas tentativas. Aguarde alguns minutos e tente de novo.', 'auth/network-request-failed': 'Sem conexão com a internet.',
  'auth/operation-not-allowed': 'Login por e-mail/senha não está ativado no Firebase (Authentication › Sign-in method).',
  'auth/invalid-api-key': 'Configuração do Firebase inválida (apiKey).', 'auth/unauthorized-domain': 'Este endereço não está autorizado no Firebase (Authentication › Settings › Authorized domains).'
};
const authMsg = e => { const c = e && e.code; return c in AUTH_ERR ? AUTH_ERR[c] : (c ? 'Erro: ' + c : ((e && e.message) || 'Erro inesperado.')); };
const toEmail = u => { u = String(u || '').trim().toLowerCase(); return u.includes('@') ? u : u.replace(/\s+/g, '') + '@' + LOGIN_DOMAIN; };
const nameOf = u => String(u.displayName || String(u.email || '').split('@')[0] || 'USUARIO').toUpperCase();

const Auth = {
  user: null, inside: false,
  boot() {
    if (Store.mode !== 'firebase') { this.showLogin(); return; }
    this.showLoading();
    const { AU, auth } = Store.fb;
    AU.onAuthStateChanged(auth, u => u ? this.enter(u) : this.leave(), e => this.showLogin(authMsg(e)));
  },
  enter(u) {
    if (this.inside && this.user && this.user.uid === u.uid) return;
    this.user = u; this.inside = true;
    Store.user = nameOf(u); LS.set('rom_user', Store.user);
    R = LS.get('rom_draft_' + Store.user, null) || { cpf: '', placa: '', conf: ['', '', ''], ajud: ['', '', ''] };
    Store.startSync();
    $('#app').classList.remove('locked'); $('#main').classList.remove('gmode');
    $('#main').innerHTML = '<div class="empty">Carregando…</div>';
    renderConn(); renderNav(); render(); registerAcesso(); Presence.start(); renderOnline();
    setTimeout(() => { if (Store.ready && !Store.data.motoristas.size) toast('Base vazia — use Configurações › Importar base da planilha'); }, 3000);
  },
  leave() {
    if (this.inside) { Presence.stop(); Store.stopSync(); this.inside = false; renderOnline(); }
    this.user = null; $('#app').classList.add('locked'); this.showLogin();
  },
  async logout() {
    const { F, db, AU, auth } = Store.fb;
    try { await Promise.race([Presence.off(), new Promise(r => setTimeout(r, 1500))]); Store.stopSync(); await AU.signOut(auth); await F.terminate(db); await F.clearIndexedDbPersistence(db); } catch (e) { console.warn(e); }
    location.reload();
  },
  showLoading() {
    const m = $('#main'); m.classList.add('gmode');
    m.innerHTML = '<div class="gcard"><h2>Verificando acesso…</h2><p class="gsub">Aguarde um instante.</p></div>';
  },
  showLogin(msg) {
    $('#app').classList.add('locked');
    const m = $('#main'); m.classList.add('gmode');
    const online = Store.mode === 'firebase';
    m.innerHTML = `<div class="gcard">
      <div class="ghead"><div class="glock" aria-hidden="true">🔒</div><div><h2>Acesso ao sistema</h2><p class="gsub">Entre com seu usuário e senha</p></div></div>
      <form id="gf" novalidate>
        <div class="fld"><label class="f" for="gu">Usuário</label><input class="in" id="gu" autocomplete="username" autocapitalize="off" spellcheck="false"></div>
        <div class="fld"><label class="f" for="gp">Senha</label>
          <div class="pw"><input class="in" id="gp" type="password" autocomplete="current-password"><button type="button" id="gs" tabindex="-1" aria-label="Mostrar senha" title="Mostrar/ocultar senha">👁</button></div>
          <div class="gcaps" id="gcaps" hidden>⚠ Caps Lock está ligado</div></div>
        <label class="gcheck"><input type="checkbox" id="gr" checked> Manter conectado neste aparelho</label>
        <div class="gerr" id="gerr" role="alert"></div>
        <button class="btn pri big full" id="gb" type="submit">Entrar</button>
      </form>
    </div>`;
    const err = t => { $('#gerr').textContent = t || ''; };
    err(msg || (online ? '' : Store.error));
    const last = LS.get('rom_lastuser', ''); $('#gu').value = last; ($('#gu').value ? $('#gp') : $('#gu')).focus();
    $('#gs').onclick = () => { const p = $('#gp'); p.type = p.type === 'password' ? 'text' : 'password'; };
    $('#gp').addEventListener('keydown', e => { if (e.getModifierState) $('#gcaps').hidden = !e.getModifierState('CapsLock'); });
    $('#gp').addEventListener('keyup', e => { if (e.getModifierState) $('#gcaps').hidden = !e.getModifierState('CapsLock'); });
    $('#gf').onsubmit = async ev => {
      ev.preventDefault(); err('');
      const u = $('#gu').value.trim(), pw = $('#gp').value;
      if (!u || !pw) return err('Informe usuário e senha.');
      if (!online) return err(Store.error || 'Sem conexão com o Firebase. Recarregue a página e tente de novo.');
      const { AU, auth } = Store.fb, btn = $('#gb'); btn.disabled = true; btn.textContent = 'Entrando…';
      try {
        await AU.setPersistence(auth, $('#gr').checked ? AU.browserLocalPersistence : AU.browserSessionPersistence).catch(() => {});
        await AU.signInWithEmailAndPassword(auth, toEmail(u), pw);
        LS.set('rom_lastuser', u);
      } catch (x) { err(authMsg(x)); btn.disabled = false; btn.textContent = 'Entrar'; $('#gp').select(); }
    };
  }
};
$('#logout').onclick = () => { if (Store.mode === 'firebase') Auth.logout(); else location.reload(); };

/* ---------- boot ---------- */
renderNav(); renderConn();
await Store.init();
await Auth.boot();
</script>
